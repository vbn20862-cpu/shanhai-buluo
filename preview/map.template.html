<title>山海部落</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：橫式時左邊是全島地圖、右邊是族群資訊；直式時上下堆疊 */
:root{
  --bg:#14212A; --sea:#0F1A21; --panel:#1C2E38; --line:#30495A; --ink:#F2EAD6; --mute:#9DB0B8;
  --gold:#E3B341; --red:#D0503A; --land:#3A4B53;
  --display:"LXGW WenKai TC","Noto Serif TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55}
.wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;min-height:100%}
.mapbox{background:var(--sea);border:1px solid var(--line);border-radius:10px;min-width:0;display:flex;align-items:center;justify-content:center;padding:6px}
.mapbox svg{width:100%;height:auto;max-height:78vh;display:block;touch-action:manipulation}
.side{min-width:0;display:flex;flex-direction:column;gap:10px}
h1{font-family:var(--display);font-size:26px;margin:0;letter-spacing:.06em;line-height:1.2}
.sub{color:var(--mute);margin:0;font-size:13px}
.band{height:8px;border-radius:2px;background:
  linear-gradient(135deg,var(--red) 25%,transparent 25%) 0 0/16px 8px,
  linear-gradient(225deg,var(--red) 25%,transparent 25%) 0 0/16px 8px,
  linear-gradient(45deg,var(--gold) 25%,transparent 25%) 0 0/16px 8px,
  linear-gradient(315deg,var(--gold) 25%,var(--panel) 25%) 0 0/16px 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h2{font-family:var(--display);font-size:21px;margin:0 0 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .en{color:var(--mute);font-size:13px}
.card p{margin:6px 0 0}
.chip{font-family:var(--body);font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.04em}
.chip.on{background:var(--gold);color:#2A1F05}
.chip.soon{border:1px solid var(--line);color:var(--mute)}
.dot{width:12px;height:12px;border-radius:3px;flex:none;display:inline-block}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;margin:0;padding:0;list-style:none}
.list button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;
  border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-size:13.5px}
.list button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.list button[aria-pressed="true"]{background:var(--panel);border-color:var(--gold)}
.list .st{margin-left:auto;font-size:11px;color:var(--mute)}
.list .st.on{color:var(--gold);font-weight:700}
.label{font-size:11.5px;letter-spacing:.14em;color:var(--mute);margin:4px 0 0}
.note{color:var(--mute);font-size:12.5px;margin:0}
.hex{stroke:var(--sea);stroke-width:.6;cursor:pointer;transition:opacity .15s}
.hex.dim{opacity:.28}
.hex.sel{stroke:var(--ink);stroke-width:1}
.mlabel{font-family:var(--body);font-weight:700;font-size:6.2px;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:1.6px;pointer-events:none;text-anchor:middle}
@media (orientation:landscape) and (min-width:600px){
  .wrap{grid-template-columns:minmax(0,.8fr) minmax(0,1fr);height:100%;min-height:0}
  .mapbox{height:100%;box-sizing:border-box;min-height:0}
  .mapbox svg{width:auto;height:100%;max-height:none;max-width:100%}
  .side{overflow-y:auto;min-height:0;padding-right:2px}
}
@media (prefers-reduced-motion:reduce){.hex{transition:none}}
</style>

<div class="wrap">
  <div class="mapbox"><svg id="map" role="img" aria-label="台灣全島地圖，依 17 個原住民族的傳統分布區上色"></svg></div>
  <div class="side">
    <div>
      <h1>山海部落</h1>
      <p class="sub">世界地圖預覽 · 全島 313 格 · 17 族各有自己的區域</p>
    </div>
    <div class="band" aria-hidden="true"></div>
    <div class="card" id="info" aria-live="polite"></div>
    <p class="label">17 族（點一下看位置）</p>
    <ul class="list" id="list"></ul>
    <p class="note">目前只有地圖完成，蓋部落、採集、出征與連線還在製作中。灰色格子是尚未劃入任何族群區域的平原與都會。</p>
  </div>
</div>

<script>/*GEO*/</script>
<script>
(function(){
  var T=[
    {id:'atayal',zh:'泰雅族',en:'Atayal',c:'#B5483A',on:1,area:'北部山區，從新北烏來到臺中和平，以及宜蘭大同、南澳'},
    {id:'bunun',zh:'布農族',en:'Bunun',c:'#3E8A62',on:1,area:'中央山脈兩側：南投信義、仁愛，花蓮卓溪、萬榮，臺東海端、延平，高雄桃源、那瑪夏'},
    {id:'amis',zh:'阿美族',en:'Amis / Pangcah',c:'#2F78C2',on:1,area:'花蓮、臺東的縱谷與海岸'},
    {id:'paiwan',zh:'排灣族',en:'Paiwan',c:'#C9962B',on:1,area:'屏東山區與臺東南部'},
    {id:'saisiyat',zh:'賽夏族',en:'SaySiyat',c:'#D98E3F',area:'新竹五峰，苗栗南庄、獅潭'},
    {id:'kavalan',zh:'噶瑪蘭族',en:'Kavalan',c:'#4FA7B0',area:'原居宜蘭平原，今日多在花蓮、臺東海岸'},
    {id:'truku',zh:'太魯閣族',en:'Truku',c:'#8163B5',area:'花蓮秀林、萬榮、卓溪'},
    {id:'sakizaya',zh:'撒奇萊雅族',en:'Sakizaya',c:'#E6C04A',area:'花蓮奇萊平原'},
    {id:'seediq',zh:'賽德克族',en:'Seediq',c:'#C9628F',area:'南投仁愛'},
    {id:'thao',zh:'邵族',en:'Thao',c:'#59A6DC',area:'南投日月潭'},
    {id:'tsou',zh:'鄒族',en:'Tsou',c:'#9A7645',area:'嘉義阿里山'},
    {id:'kanakanavu',zh:'卡那卡那富族',en:'Kanakanavu',c:'#A9BC4E',area:'高雄那瑪夏'},
    {id:'hlaalua',zh:'拉阿魯哇族',en:"Hla'alua",c:'#D6805F',area:'高雄桃源、那瑪夏'},
    {id:'siraya',zh:'西拉雅族',en:'Siraya',c:'#8FA3B8',area:'臺南一帶。2026 年核定為第 17 個原住民族'},
    {id:'rukai',zh:'魯凱族',en:'Rukai',c:'#A4559A',area:'屏東霧台、高雄茂林、臺東東興'},
    {id:'pinuyumayan',zh:'卑南族',en:'Pinuyumayan',c:'#5FAE70',area:'臺東平原'},
    {id:'tao',zh:'雅美族（達悟族）',en:'Yami / Tao',c:'#2BB3AC',area:'蘭嶼'}
  ];
  var byId={};T.forEach(function(t){byId[t.id]=t});
  var G=Geo.build(),NS='http://www.w3.org/2000/svg',svg=document.getElementById('map');
  svg.setAttribute('viewBox','0 0 '+Geo.MAP_W+' '+Geo.MAP_H);
  function el(n,a,txt){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e}
  var cnt={};
  G.hexes.forEach(function(h){
    var t=h.tribe&&byId[h.tribe];if(t)cnt[t.id]=(cnt[t.id]||0)+1;
    var p=el('polygon',{points:Geo.hexCorners(h.x,h.y).map(function(q){return q[0].toFixed(2)+','+q[1].toFixed(2)}).join(' '),
      fill:t?t.c:'#3A4B53','class':'hex','data-t':h.tribe||''});
    if(!t)p.setAttribute('fill-opacity','.55');
    svg.appendChild(p);
  });
  svg.appendChild(el('path',{d:Geo.outlinePath(Geo.ISLETS.ludao),fill:'#3A4B53','fill-opacity':'.55'}));
  T.forEach(function(t){var c=G.centroid[t.id];if(!c)return;
    var short=t.zh.replace('族','').replace('（達悟）','');
    svg.appendChild(el('text',{x:c[0],y:c[1]+2,'class':'mlabel'},short));});
  var info=document.getElementById('info'),list=document.getElementById('list'),cur=null;
  T.forEach(function(t){
    var li=document.createElement('li'),b=document.createElement('button');
    b.type='button';b.id='t-'+t.id;b.setAttribute('aria-pressed','false');
    b.innerHTML='<span class="dot" style="background:'+t.c+'"></span><span>'+t.zh+'</span><span class="st'+(t.on?' on':'')+'">'+(t.on?'第一版':'之後')+'</span>';
    b.addEventListener('click',function(){select(t.id)});li.appendChild(b);list.appendChild(li);
  });
  function select(id){
    cur=id;var t=byId[id];
    svg.querySelectorAll('.hex').forEach(function(p){var m=p.getAttribute('data-t')===id;p.classList.toggle('sel',!!id&&m);p.classList.toggle('dim',!!id&&!m)});
    list.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',b.id==='t-'+id?'true':'false')});
    if(!t){info.innerHTML='<h2>其他地區</h2><p>這一格還沒有劃入任何族群的區域。</p>';return}
    info.innerHTML='<h2><span class="dot" style="background:'+t.c+'"></span>'+t.zh+
      ' <span class="chip '+(t.on?'on':'soon')+'">'+(t.on?'第一版開放':'之後開放')+'</span></h2>'+
      '<div class="en">'+t.en+' · 地圖上 '+(cnt[t.id]||0)+' 格</div><p>'+t.area+'</p>'+
      '<p class="note">'+(t.on?'選這個區域落腳，部落會帶有這一族預設的建築、物產與族語。':'區域已經在地圖上，預設內容會在之後的版本加入。')+'</p>';
  }
  svg.addEventListener('click',function(e){var t=e.target.getAttribute&&e.target.getAttribute('data-t');if(t!=null)select(t||null)});
  select('bunun');
})();
</script>
