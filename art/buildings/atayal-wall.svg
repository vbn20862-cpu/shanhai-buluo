<svg xmlns="http://www.w3.org/2000/svg" class="atayal-wall" viewBox="-80 -140 160 180" width="160" height="180" data-origin="0,0" data-height="31">
<title>泰雅族 竹圍</title>
<desc>原點(0,0)＝佔地中心。可替換變數：--roof 屋頂、--wall 牆、--deco 裝飾、--ground 地面。#deco 為可開關的裝飾圖層。</desc>
<style>
svg.atayal-wall{--roof:#C8A35A;--wall:#A9A35C;--deco:#B5483A;--ground:#BFA97F}
.f-roof{fill:var(--roof)}
.f-roof-ll{fill:color-mix(in srgb,var(--roof),#FFF1CF 45%)}
.f-roof-l{fill:color-mix(in srgb,var(--roof),#FFF1CF 22%)}
.f-roof-d{fill:color-mix(in srgb,var(--roof),#26304A 30%)}
.f-roof-dd{fill:color-mix(in srgb,var(--roof),#1C2234 52%)}
.s-roof{stroke:var(--roof)}
.s-roof-ll{stroke:color-mix(in srgb,var(--roof),#FFF1CF 45%)}
.s-roof-l{stroke:color-mix(in srgb,var(--roof),#FFF1CF 22%)}
.s-roof-d{stroke:color-mix(in srgb,var(--roof),#26304A 30%)}
.s-roof-dd{stroke:color-mix(in srgb,var(--roof),#1C2234 52%)}
.f-wall{fill:var(--wall)}
.f-wall-ll{fill:color-mix(in srgb,var(--wall),#FFF1CF 45%)}
.f-wall-l{fill:color-mix(in srgb,var(--wall),#FFF1CF 22%)}
.f-wall-d{fill:color-mix(in srgb,var(--wall),#26304A 30%)}
.f-wall-dd{fill:color-mix(in srgb,var(--wall),#1C2234 52%)}
.s-wall{stroke:var(--wall)}
.s-wall-ll{stroke:color-mix(in srgb,var(--wall),#FFF1CF 45%)}
.s-wall-l{stroke:color-mix(in srgb,var(--wall),#FFF1CF 22%)}
.s-wall-d{stroke:color-mix(in srgb,var(--wall),#26304A 30%)}
.s-wall-dd{stroke:color-mix(in srgb,var(--wall),#1C2234 52%)}
.f-deco{fill:var(--deco)}
.f-deco-ll{fill:color-mix(in srgb,var(--deco),#FFF1CF 45%)}
.f-deco-l{fill:color-mix(in srgb,var(--deco),#FFF1CF 22%)}
.f-deco-d{fill:color-mix(in srgb,var(--deco),#26304A 30%)}
.f-deco-dd{fill:color-mix(in srgb,var(--deco),#1C2234 52%)}
.s-deco{stroke:var(--deco)}
.s-deco-ll{stroke:color-mix(in srgb,var(--deco),#FFF1CF 45%)}
.s-deco-l{stroke:color-mix(in srgb,var(--deco),#FFF1CF 22%)}
.s-deco-d{stroke:color-mix(in srgb,var(--deco),#26304A 30%)}
.s-deco-dd{stroke:color-mix(in srgb,var(--deco),#1C2234 52%)}
.f-ground{fill:var(--ground)}
.f-ground-ll{fill:color-mix(in srgb,var(--ground),#FFF1CF 45%)}
.f-ground-l{fill:color-mix(in srgb,var(--ground),#FFF1CF 22%)}
.f-ground-d{fill:color-mix(in srgb,var(--ground),#26304A 30%)}
.f-ground-dd{fill:color-mix(in srgb,var(--ground),#1C2234 52%)}
.s-ground{stroke:var(--ground)}
.s-ground-ll{stroke:color-mix(in srgb,var(--ground),#FFF1CF 45%)}
.s-ground-l{stroke:color-mix(in srgb,var(--ground),#FFF1CF 22%)}
.s-ground-d{stroke:color-mix(in srgb,var(--ground),#26304A 30%)}
.s-ground-dd{stroke:color-mix(in srgb,var(--ground),#1C2234 52%)}
.deco-off #deco{display:none}
</style>
