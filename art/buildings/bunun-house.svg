<desc>原點(0,0)＝佔地中心。可替換變數：--roof 屋頂、--wall 牆、--deco 裝飾、--ground 地面。#deco 為可開關的裝飾圖層。待查證：屋頂材質與坡度</desc>
<style>
svg.bunun-house{--roof:#646A70;--wall:#868B8E;--deco:#3E8A62;--ground:#A89E86}
