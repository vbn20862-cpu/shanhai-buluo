.s-deco-dd{stroke:color-mix(in srgb,var(--deco),#1C2234 52%)}
.f-ground{fill:var(--ground)}
.f-ground-ll{fill:color-mix(in srgb,var(--ground),#FFF1CF 45%)}
.f-ground-l{fill:color-mix(in srgb,var(--ground),#FFF1CF 22%)}
.f-ground-d{fill:color-mix(in srgb,var(--ground),#26304A 30%)}
.f-ground-dd{fill:color-mix(in srgb,var(--ground),#1C2234 52%)}
.s-ground{stroke:var(--ground)}
.s-ground-ll{stroke:color-mix(in srgb,var(--ground),#FFF1CF 45%)}
.s-ground-l{stroke:color-mix(in srgb,var(--ground),#FFF1CF 22%)}
.s-ground-d{stroke:color-mix(in srgb,var(--ground),#26304A 30%)}
.s-ground-dd{stroke:color-mix(in srgb,var(--ground),#1C2234 52%)}
.deco-off #deco{display:none}
</style>
