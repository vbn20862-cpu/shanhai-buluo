.s-wall-l{stroke:color-mix(in srgb,var(--wall),#FFF1CF 22%)}
.s-wall-d{stroke:color-mix(in srgb,var(--wall),#26304A 30%)}
.s-wall-dd{stroke:color-mix(in srgb,var(--wall),#1C2234 52%)}
.f-deco{fill:var(--deco)}
.f-deco-ll{fill:color-mix(in srgb,var(--deco),#FFF1CF 45%)}
.f-deco-l{fill:color-mix(in srgb,var(--deco),#FFF1CF 22%)}
