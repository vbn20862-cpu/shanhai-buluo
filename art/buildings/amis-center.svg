<svg xmlns="http://www.w3.org/2000/svg" class="amis-center" viewBox="-80 -140 160 180" width="160" height="180" data-origin="0,0" data-height="90">
<title>阿美族 聚會所</title>
<desc>原點(0,0)＝佔地中心。可替換變數：--roof 屋頂、--wall 牆、--deco 裝飾、--ground 地面。#deco 為可開關的裝飾圖層。屋頂形式、柱數與高度待查證。</desc>
<style>
svg.amis-center{--roof:#D6A44A;--wall:#C2B46C;--deco:#2F78C2;--ground:#DCC894}
