<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 32 32"><title>飛行中的箭</title><style>svg{--dust:#CDB98E;--tip:#C9C4B4;--wood:#7A5534;--D:#26304A 30%;--L:#FFF1CF 22%} svg *{stroke-linecap:round;stroke-linejoin:round}.f-tip{fill:var(--tip)}.f-tip-d{fill:color-mix(in srgb,var(--tip),var(--D))}.f-tip-l{fill:color-mix(in srgb,var(--tip),var(--L))}.s-dust-l{stroke:color-mix(in srgb,var(--dust),var(--L))}.s-wood-l{stroke:color-mix(in srgb,var(--wood),var(--L))}</style><g id="fx"><path d="M-14 0L9 0" fill="none" stroke-width="1.4" class="s-wood-l"/><polygon points="15,0 8,-3 9.5,0 8,3" class="f-tip"/><polygon points="-14,0 -10,0 -13,-3.5 -16,-3.5" class="f-tip-l"/><polygon points="-14,0 -10,0 -13,3.5 -16,3.5" class="f-tip-d"/><path d="M-15 -6L-5 -6M-12 6L-3 6" fill="none" stroke-width="0.8" class="s-dust-l"/></g></svg>
