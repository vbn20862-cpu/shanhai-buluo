<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 32 32"><title>飄落的葉子 a</title><style>svg{--leaf:#6F9A48;--D:#26304A 30%;--L:#FFF1CF 22%} svg *{stroke-linecap:round;stroke-linejoin:round}.f-leaf{fill:var(--leaf)}.f-leaf-d{fill:color-mix(in srgb,var(--leaf),var(--D))}.s-leaf-l{stroke:color-mix(in srgb,var(--leaf),var(--L))}</style><g id="fx"><polygon points="-11,4 -5,-5 6,-7 11,-3 4,4 -6,7" class="f-leaf"/><polygon points="-11,4 4,4 11,-3 6,0" class="f-leaf-d"/><path d="M-10 3.5L10 -3" fill="none" stroke-width="1" class="s-leaf-l"/></g></svg>
