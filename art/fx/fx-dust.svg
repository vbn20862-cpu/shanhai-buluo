<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 32 32"><title>揚起的塵土</title><style>svg{--dust:#CDB98E}.f-dust{fill:var(--dust)}.f-dust-d{fill:color-mix(in srgb,var(--dust),#26304A 30%)}.f-dust-l{fill:color-mix(in srgb,var(--dust),#FFF1CF 22%)}</style><g id="fx"><circle cx="-4" cy="3" r="8" class="f-dust-d"/><circle cx="4" cy="2" r="9" class="f-dust"/><circle cx="-2" cy="-4" r="7" class="f-dust"/><circle cx="-4" cy="-6" r="3.5" class="f-dust-l"/><circle cx="9" cy="7" r="3" class="f-dust-l"/></g></svg>
