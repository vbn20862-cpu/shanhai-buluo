<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -70 60 80"><title>泰雅族 山林獵手 出擊</title><style>svg{--cloth:#8C7356;--hair:#2B211B;--main:#B5483A;--skin:#B9845A;--tip:#C9C4B4;--wood:#7A5534;--wrap:#6E5440}.f-cloth{fill:var(--cloth)}.f-cloth-d{fill:color-mix(in srgb,var(--cloth),#26304A 30%)}.f-hair{fill:var(--hair)}.f-main{fill:var(--main)}.f-main-d{fill:color-mix(in srgb,var(--main),#26304A 30%)}.f-main-l{fill:color-mix(in srgb,var(--main),#FFF1CF 22%)}.f-skin{fill:var(--skin)}.f-skin-d{fill:color-mix(in srgb,var(--skin),#26304A 30%)}.f-tip{fill:var(--tip)}.f-wrap{fill:var(--wrap)}.s-skin{stroke:var(--skin)}.s-skin-d{stroke:color-mix(in srgb,var(--skin),#26304A 30%)}.s-wood{stroke:var(--wood)}</style><g id="shadow"><ellipse cx="0" cy="0" rx="9" ry="2.6" fill="#1F2A44" opacity=".26"/></g><g id="body"><path d="M-1.6 -8L-12.5 0" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" class="s-skin-d"/><path d="M2.2 -8L9.5 -6.5 10.5 0" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" class="s-skin"/><polygon points="-2.9,-12.6 6.8,-7.4 4.2,-1.1 -6.6,-6.8" class="f-cloth"/><polygon points="2.9,-9.5 6.8,-7.4 4.2,-1.1 0.1,-3.3" class="f-cloth-d"/><path d="M2.1 -18.1L1.9 -12.3 4.2 -12.2" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="s-skin-d"/><polygon points="1.9,-20.2 10.5,-15.6 6.3,-6.6 -3.3,-11.6" class="f-main"/><polygon points="7.2,-17.4 10.5,-15.6 6.3,-6.6 2.8,-8.4" class="f-main-d"/><polygon points="1.9,-20.2 5.7,-18.2 4.6,-17.2 1.1,-19" class="f-main-l"/><polygon points="1.8,-20.3 4.7,-18.7 6.8,-7.8 6,-6.1 3.4,-7.8" class="f-wrap"/><circle cx="8.2" cy="-24" r="6" class="f-hair"/><circle cx="9" cy="-22" r="5.7" class="f-skin"/><polygon points="13.5,-24.7 14.6,-20.8 12.8,-17.6 9.8,-16.9" class="f-skin-d"/><path d="M8.6 -14.6L12.2 -10.2" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="s-skin"/></g><g id="band" fill="currentColor"><polygon points="3.7,-27.6 16.2,-23.3 15,-20.9 2.7,-25.2" fill="currentColor"/><polygon points="-2.2,-14 7.7,-8.8 6.3,-6.1 -3.7,-11.4" fill="currentColor"/></g><g id="weapon"><path d="M-0.7 -13.4L23.8 -7.3" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="s-wood"/><polygon points="30.6,-5.6 23.3,-5.4 24.3,-9.3" class="f-tip"/></g></svg>
