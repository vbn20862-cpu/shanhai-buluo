<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -70 60 80"><title>阿美族 部落青年 奔跑</title><style>svg{--cloth:#8C7356;--hair:#2B211B;--main:#2F78C2;--skin:#B9845A;--tip:#C9C4B4;--wood:#7A5534;--wrap:#CDB98E}.f-cloth{fill:var(--cloth)}.f-cloth-d{fill:color-mix(in srgb,var(--cloth),#26304A 30%)}.f-hair{fill:var(--hair)}.f-main{fill:var(--main)}.f-main-d{fill:color-mix(in srgb,var(--main),#26304A 30%)}.f-main-l{fill:color-mix(in srgb,var(--main),#FFF1CF 22%)}.f-skin{fill:var(--skin)}.f-skin-d{fill:color-mix(in srgb,var(--skin),#26304A 30%)}.f-tip{fill:var(--tip)}.f-wrap{fill:var(--wrap)}.s-skin{stroke:var(--skin)}.s-skin-d{stroke:color-mix(in srgb,var(--skin),#26304A 30%)}.s-wood{stroke:var(--wood)}</style><g id="shadow"><ellipse cx="0" cy="0" rx="9" ry="2.6" fill="#1F2A44" opacity=".26"/></g><g id="body"><path d="M-1.6 -9L-5.5 -4.5 -11.5 -3.5" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" class="s-skin-d"/><path d="M2.2 -9L8.5 -8.5 8.8 -0.5" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" class="s-skin"/><polygon points="-3.3,-13.4 6.7,-8.9 4.5,-2.4 -6.6,-7.4" class="f-cloth"/><polygon points="2.7,-10.7 6.7,-8.9 4.5,-2.4 0.3,-4.3" class="f-cloth-d"/><path d="M1.3 -19.2L1.3 -14 1.5 -13.4" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="s-skin-d"/><polygon points="0.9,-21.3 9.9,-17.3 6.2,-8 -3.6,-12.4" class="f-main"/><polygon points="6.4,-18.9 9.9,-17.3 6.2,-8 2.7,-9.6" class="f-main-d"/><polygon points="0.9,-21.3 4.8,-19.6 3.8,-18.5 0.2,-20.1" class="f-main-l"/><polygon points="0.8,-21.4 3.8,-20 6.7,-9.3 6,-7.5 3.3,-9.1" class="f-wrap"/><circle cx="6.9" cy="-25.5" r="6" class="f-hair"/><circle cx="7.9" cy="-23.6" r="5.7" class="f-skin"/><polygon points="12.2,-26.6 13.6,-22.8 12,-19.5 9.1,-18.6" class="f-skin-d"/><path d="M8 -16.2L9.6 -13.1" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="s-skin"/></g><g id="band" fill="currentColor"><p