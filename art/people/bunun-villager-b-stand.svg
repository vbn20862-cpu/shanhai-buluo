<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -70 60 80"><title>布農族 族人（扛柴）</title><style>svg{--cloth:#8C7356;--hair:#2B211B;--main:#3E8A62;--skin:#B9845A;--wood:#7A5534}.f-cloth{fill:var(--cloth)}.f-cloth-d{fill:color-mix(in srgb,var(--cloth),#26304A 30%)}.f-hair{fill:var(--hair)}.f-main{fill:var(--main)}.f-main-d{fill:color-mix(in srgb,var(--main),#26304A 30%)}.f-main-l{fill:color-mix(in srgb,var(--main),#FFF1CF 22%)}.f-skin{fill:var(--skin)}.f-skin-d{fill:color-mix(in srgb,var(--skin),#26304A 30%)}.s-skin{stroke:var(--skin)}.s-skin-d{stroke:color-mix(in srgb,var(--skin),#26304A 30%)}.s-wood{stroke:var(--wood)}.s-wood-dd{stroke:color-mix(in srgb,var(--wood),#1C2234 52%)}.s-wood-l{stroke:color-mix(in srgb,var(--wood),#FFF1CF 22%)}</style><g id="shadow"><ellipse cx="0" cy="0" rx="9" ry="2.6" fill="#1F2A44" opacity=".26"/></g><g id="body"><path d="M-2 -9L-2.4 0" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" class="s-skin-d"/><path d="M2.2 -9L2.8 0" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" class="s-skin"/><polygon points="-5.4,-14 5.6,-14 6.2,-7.2 -6,-7.2" class="f-cloth"/><polygon points="1.2,-14 5.6,-14 6.2,-7.2 1.6,-7.2" class="f-cloth-d"/><path d="M-3.6 -21.2L-4.6 -13" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="s-skin-d"/><polygon points="-4.8,-23 5,-23 5.5,-13 -5.3,-13" class="f-main"/><polygon points="1.2,-23 5,-23 5.5,-13 1.6,-13" class="f-main-d"/><polygon points="-4.8,-23 -0.5,-23 -1,-21.6 -4.9,-21.6" class="f-main-l"/><circle cx="-1" cy="-29.3" r="6" class="f-hair"/><circle cx="0.7" cy="-27.9" r="5.7" class="f-skin"/><polygon points="3.4,-32.4 6.2,-29.5 6.1,-25.8 3.8,-23.8" class="f-skin-d"/><path d="M3.8 -21.2L5.2 -19.5 2.6 -25.5" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="s-skin"/></g><g id="band" fill="currentColor"><polygon points="-6.6,-30.4 6.4,-32.4 6.5,-29.8 -6.4,-27.8" fill="currentColor"/><polygon points="-5.5,-15.6 5.7,-15.6 5.8,-12.6 -5.6,-12.6" fill="currentColor"/></g><g id="weapon"><path d="M-14 -25L8 -29" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="s-wood"/><path d="M-14 -21.8L8 -25.8" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="s-wood"/><path d="M-14 -23.4L8 -27.4" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="s-wood-l"/><path d="M-6 -30L-5.5 -21M2 -31.5L2.5 -22.5" fill="none" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" class="s-wood-dd"/></g></svg>
