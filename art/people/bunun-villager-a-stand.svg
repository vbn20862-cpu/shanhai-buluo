<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -70 60 80"><title>布農族 族人（背簍）</title><style>svg{--cloth:#8C7356;--hair:#2B211B;--main:#3E8A62;--skin:#B9845A;--wood:#7A5534}.f-cloth{fill:var(--cloth)}.f-cloth-d{fill:color-mix(in srgb,var(--cloth),#26304A 30%)}.f-hair{fill:var(--hair)}.f-main{fill:var(--main)}.f-main-d{fill:color-mix(in srgb,var(--main),#26304A 30%)}.f-main-l{fill:color-mix(in srgb,var(--main),#FFF1CF 22%)}.f-skin{fill:var(--skin)}.f-skin-d{fill:color-mix(in srgb,var(--skin),#26304A 30%)}.f-wood{fill:var(--wood)}.f-wood-dd{fill:color-mix(in srgb,var(--wood),#1C2234 52%)}.f-wood-l{fill:color-mix(in srgb,var(--wood),#FFF1CF 22%)}.s-skin{stroke:var(--skin)}.s-skin-d{stroke:color-mix(in srgb,var(--skin),#26304A 30%)}.s-wood-d{stroke:color-mix(in srgb,var(--wood),#26304A 30%)}.s-wood-dd{stroke:color-mix(in srgb,var(--wood),#1C2234 52%)}</style><g id="shadow"><ellipse cx="0" cy="0" rx="9" ry="2.6" fill="#1F2A44" opacity=".26"/></g><g id="body"><path d="M-2 -9L-2.4 0" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" class="s-skin-d"/><path d="M2.2 -9L2.8 0" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" class="s-skin"/><polygon points="-12.4,-27 -4.6,-27 -5.2,-11 -11.6,-11" class="f-wood-l"/><polygon points="-8.6,-27 -4.6,-27 -5.2,-11 -8.4,-11" class="f-wood"/><path d="M-12 -21.6L-4.8 -21.6M-11.8 -16.2L-5 -16.2" fill="none" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" class="s-wood-d"/><ellipse cx="-8.5" cy="-27" rx="4" ry="1.5" class="f-wood-dd"/><polygon points="-5.4,-14 5.6,-14 6.2,-7.2 -6,-7.2" class="f-cloth"/><polygon points="1.2,-14 5.6,-14 6.2,-7.2 1.6,-7.2" class="f-cloth-d"/><polygon points="-4.8,-23 5,-23 5.5,-13 -5.3,-13" class="f-main"/><polygon points="1.2,-23 5,-23 5.5,-13 1.6,-13" class="f-main-d"/><polygon points="-4.8,-23 -0.5,-23 -1,-21.6 -4.9,-21.6" class="f-main-l"/><circle cx="-1" cy="-29.3" r="6" class="f-hair"/><circle cx="0.7" cy="-27.9" r="5.7" clas