<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -70 60 80"><title>布農族 弓手 出擊</title><style>svg{--cloth:#8C7356;--hair:#2B211B;--main:#3E8A62;--skin:#B9845A;--tip:#C9C4B4;--wood:#7A5534}.f-cloth{fill:var(--cloth)}.f-cloth-d{fill:color-mix(in srgb,var(--cloth),#26304A 30%)}.f-hair{fill:var(--hair)}.f-main{fill:var(--main)}.f-main-d{fill:color-mix(in srgb,var(--main),#26304A 30%)}.f-main-l{fill:color-mix(in srgb,var(--main),#FFF1CF 22%)}.f-skin{fill:var(--skin)}.f-skin-d{fill:color-mix(in srgb,var(--skin),#26304A 30%)}.f-tip{fill:var(--tip)}.s-skin{stroke:var(--skin)}.s-skin-d{stroke:color-mix(in srgb,var(--skin),#26304A 30%)}.s-tip-l{stroke:color-mix(in srgb,var(--tip),#FFF1CF 22%)}.s-wood{stroke:var(--wood)}.s-wood-l{stroke:color-mix(in srgb,var(--wood),#FFF1CF 22%)}</style><g id="shadow"><ellipse cx="0" cy="0" rx="9" ry="2.6" fill="#1F2A44" opacity=".26"/></g><g id="body"><path d="M-1.6 -8L-12.5 0" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" class="s-skin-d"/><path d="M2.2 -8L9.5 -6.5 10.5 0" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" class="s-skin"/><polygon points="-5.8,-11.9 5.2,-13.1 6.5,-6.4 -5.7,-5.1" class="f-cloth"/><polygon points="0.8,-12.6 5.2,-13.1 6.5,-6.4 1.9,-5.9" class="f-cloth-d"/><path d="M-4.8 -19.3L-8.3 -22.3 -0.7 -20.9" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="s-skin-d"/><polygon points="-6.1,-20.9 3.6,-22 5.2,-12.1 -5.6,-10.9" class="f-main"/><polygon points="-0.2,-21.6 3.6,-22 5.2,-12.1 1.3,-11.7" class="f-main-d"/><polygon points="-6.1,-20.9 -1.9,-21.4 -2.2,-19.9 -6.1,-19.5" class="f-main-l"/><circle cx="-3" cy="-27.6" r="6" class="f-hair"/><circle cx="-1.2" cy="-26.4" r="5.7" class="f-skin"/><polygon points="1,-31.1 4.1,-28.5 4.4,-24.9 2.3,-22.6" class="f-skin-d"/><path d="M2.6 -20L13.3 -21" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="s-skin"/></g><g id="band" fill="currentColor"><polygon points="-8.7,-28.1 4,-31.4 4.4,-28.9 -8.2,-25.5" fill="currentColor"/><polygon points="-6.1,-13.5 5.1,-14.7 5.5,-11.7 -5.8,-10.5" fill="currentColor"/></g><g id="weapon"><path d="M11.3 -38Q19.3 -21 11.3 -4" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="s-wood"/><path d="M11.3 -38L-0.7 -20.9 11.3 -4" fill="none" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" class="s-tip-l"/><path d="M-0.7 -20.9L20.3 -21" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" class="s-wood-l"/><polygon points="24.3,-21 20.3,-19.4 20.3,-22.6" class="f-tip"/></g></svg>
