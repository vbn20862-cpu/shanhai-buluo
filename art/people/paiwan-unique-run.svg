<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -70 60 80"><title>排灣族 石牆守衛 奔跑</title><style>svg{--cloth:#8C7356;--hair:#2B211B;--main:#C9962B;--skin:#B9845A;--tip:#C9C4B4;--wood:#7A5534}.f-cloth{fill:var(--cloth)}.f-cloth-d{fill:color-mix(in srgb,var(--cloth),#26304A 30%)}.f-hair{fill:var(--hair)}.f-main{fill:var(--main)}.f-main-d{fill:color-mix(in srgb,var(--main),#26304A 30%)}.f-main-l{fill:color-mix(in srgb,var(--main),#FFF1CF 22%)}.f-skin{fill:var(--skin)}.f-skin-d{fill:color-mix(in srgb,var(--skin),#26304A 30%)}.f-tip{fill:var(--tip)}.f-wood{fill:var(--wood)}.f-wood-d{fill:color-mix(in srgb,var(--wood),#26304A 30%)}.s-skin{stroke:var(--skin)}.s-skin-d{stroke:color-mix(in srgb,var(--skin),#26304A 30%)}.s-wood{stroke:var(--wood)}.s-wood-dd{stroke:color-mix(in srgb,var(--wood),#1C2234 52%)}</style><g id="shadow"><ellipse cx="0" cy="0" rx="9" ry="2.6" fill="#1F2A44" opacity=".26"/></g><g id="body"><path d="M-1.6 -9L-5.5 -4.5 -11.5 -3.5" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" class="s-skin-d"/><path d="M2.2 -9L8.5 -8.5 8.8 -0.5" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" class="s-skin"/><polygon points="-3.9,-13 6.6,-9.6 5,-2.9 -6.6,-6.7" class="f-cloth"/><polygon points="2.4,-10.9 6.6,-9.6 5,-2.9 0.7,-4.3" class="f-cloth-d"/><path d="M0 -19.3L-3.2 -13.8 -1.9 -11.3" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="s-skin-d"/><polygon points="-0.5,-21.3 8.8,-18.3 6.2,-8.7 -4.1,-12" class="f-main"/><polygon points="5.2,-19.5 8.8,-18.3 6.2,-8.7 2.4,-9.9" class="f-main-d"/><polygon points="-0.5,-21.3 3.5,-20 2.6,-18.8 -1.1,-20" class="f-main-l"/><circle cx="5" cy="-26.2" r="6" class="f-hair"/><circle cx="6.2" cy="-24.3" r="5.7" class="f-skin"/><polygon points="10.2,-27.8 11.9,-24.1 10.7,-20.6 7.9,-19.5" class="f-skin-d"/><path d="M7.1 -17L8.8 -12" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="s-skin"/></g><g id="band" 