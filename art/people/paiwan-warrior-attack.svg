<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -70 60 80"><title>排灣族 勇士 出擊</title><style>svg{--cloth:#8C7356;--hair:#2B211B;--main:#C9962B;--skin:#B9845A;--tip:#C9C4B4;--wood:#7A5534}.f-cloth{fill:var(--cloth)}.f-cloth-d{fill:color-mix(in srgb,var(--cloth),#26304A 30%)}.f-hair{fill:var(--hair)}.f-main{fill:var(--main)}.f-main-d{fill:color-mix(in srgb,var(--main),#26304A 30%)}.f-main-l{fill:color-mix(in srgb,var(--main),#FFF1CF 22%)}.f-skin{fill:var(--skin)}.f-skin-d{fill:color-mix(in srgb,var(--skin),#26304A 30%)}.f-tip{fill:var(--tip)}.s-skin{stroke:var(--skin)}.s-skin-d{stroke:color-mix(in srgb,var(--skin),#26304A 30%)}.s-wood{stroke:var(--wood)}</style><g id="shadow"><ellipse cx="0" cy="0" rx="9" ry="2.6" fill="#1F2A44" opacity=".26"/></g><g id="body"><path d="M-1.6 -8L-12.5 0" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" class="s-skin-d"/><path d="M2.2 -8L9.5 -6.5 10.5 0" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" class="s-skin"/><polygon points="-3.3,-12.9 6.7,-8.4 4.5,-1.9 -6.6,-6.9" class="f-cloth"/><polygon points="2.7,-10.2 6.7,-8.4 4.5,-1.9 0.3,-3.8" class="f-cloth-d"/><path d="M1.3 -18.7L1.9 -13.8 5.7 -14.9" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="s-skin-d"/><polygon points="0.9,-20.8 9.9,-16.8 6.2,-7.5 -3.6,-11.9" class="f-main"/><polygon points="6.4,-18.4 9.9,-16.8 6.2,-7.5 2.7,-9.1" class="f-main-d"/><polygon points="0.9,-20.8 4.8,-19.1 3.8,-18 0.2,-19.6" class="f-main-l"/><circle cx="6.9" cy="-25" r="6" class="f-hair"/><circle cx="7.9" cy="-23.1" r="5.7" class="f-skin"/><polygon points="12.2,-26.1 13.6,-22.3 12,-19 9.1,-18.1" class="f-skin-d"/><path d="M8 -15.7L13.2 -13.2" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="s-skin"/></g><g id="band" fill="currentColor"><polygon points="2.3,-28.3 15,-24.9 14,-22.4 1.4,-25.9" fill="currentColor"/><polygon points="-2.7,-14.4 7.5,-9.8 6.4,-7 -4.1,-11.7" fill="currentColor"/></g><g id="weapon"><path d="M-4.1 -17.1L28.8 -9.7" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="s-wood"/><polygon points="35.6,-8.1 28.3,-7.7 29.2,-11.6" class="f-tip"/></g></svg>
