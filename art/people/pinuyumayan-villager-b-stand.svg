<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -70 60 80"><title>卑南族 族人（背竹筒拿鐮刀）</title><style>svg{--cloth:#8C7356;--hair:#2B211B;--leg:#D8CBA8;--main:#5FAE70;--skin:#B9845A;--tip:#C9C4B4;--wood:#7A5534;--D:#26304A 30%;--DD:#1C2234 52%;--L:#FFF1CF 22%} svg *{stroke-linecap:round;stroke-linejoin:round}.f-cloth{fill:var(--cloth)}.f-cloth-d{fill:color-mix(in srgb,var(--cloth),var(--D))}.f-cloth-dd{fill:color-mix(in srgb,var(--cloth),var(--DD))}.f-cloth-l{fill:color-mix(in srgb,var(--cloth),var(--L))}.f-hair{fill:var(--hair)}.f-leg-d{fill:color-mix(in srgb,var(--leg),var(--D))}.f-main{fill:var(--main)}.f-main-d{fill:color-mix(in srgb,var(--main),var(--D))}.f-main-l{fill:color-mix(in srgb,var(--main),var(--L))}.f-skin{fill:var(--skin)}.f-skin-d{fill:color-mix(in srgb,var(--skin),var(--D))}.f-tip{fill:var(--tip)}.f-wood-d{fill:color-mix(in srgb,var(--wood),var(--D))}.f-wood-dd{fill:color-mix(in srgb,var(--wood),var(--DD))}.s-cloth-dd{stroke:color-mix(in srgb,var(--cloth),var(--DD))}.s-hair-l{stroke:color-mix(in srgb,var(--hair),var(--L))}.s-main-d{stroke:color-mix(in srgb,var(--main),var(--D))}.s-skin{stroke:var(--skin)}.s-skin-d{stroke:color-mix(in srgb,var(--skin),var(--D))}.s-tip-l{stroke:color-mix(in srgb,var(--tip),var(--L))}.s-wood{stroke:var(--wood)}.s-wood-dd{stroke:color-mix(in srgb,var(--wood),var(--DD))}</style><g id="shadow"><ellipse cx="0" cy="0" rx="9" ry="2.6" fill="#1F2A44" opacity=".26"/></g><g id="body"><path d="M-1.9 -9L-2.2 -4.6 -2.4 -0.9" fill="none" stroke-width="3.8" class="s-skin-d"/><polygon points="-3.9,-1.6 1.4,-0.8 1.2,0.1 -4.1,0.1" class="f-wood-dd"/><path d="M2 -9L2.4 -4.6 2.8 -0.9" fill="none" stroke-width="3.8" class="s-skin"/><polygon points="1.3,-1.6 6.6,-0.8 6.4,0.1 1.1,0.1" class="f-wood-d"/><path d="M-1.8 -23.4L-7 -9" fill="none" stroke-width="1" class="s-wood-dd"/><polygon points="-10.6,-24.4 -6.4,-24.8 -5.6,-8.4 -9.8,-8" class="f-leg-d"/><polygon points="-8.4,-24.6 -6.4,-24.8 -5.6,-8.4 -7.6,-8.2" class="f-cloth-l"/><path d="M-10