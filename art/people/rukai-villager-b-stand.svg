<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -70 60 80"><title>魯凱族 族人（背網袋拿掘棒）</title><style>svg{--cloth:#8C7356;--hair:#2B211B;--main:#A4559A;--skin:#B9845A;--wood:#7A5534;--wrap:#CDB98E;--D:#26304A 30%;--DD:#1C2234 52%;--L:#FFF1CF 22%} svg *{stroke-linecap:round;stroke-linejoin:round}.f-cloth{fill:var(--cloth)}.f-cloth-d{fill:color-mix(in srgb,var(--cloth),var(--D))}.f-hair{fill:var(--hair)}.f-hair-l{fill:color-mix(in srgb,var(--hair),var(--L))}.f-main{fill:var(--main)}.f-main-d{fill:color-mix(in srgb,var(--main),var(--D))}.f-main-l{fill:color-mix(in srgb,var(--main),var(--L))}.f-skin{fill:var(--skin)}.f-skin-d{fill:color-mix(in srgb,var(--skin),var(--D))}.f-wood-d{fill:color-mix(in srgb,var(--wood),var(--D))}.f-wood-dd{fill:color-mix(in srgb,var(--wood),var(--DD))}.f-wrap-d{fill:color-mix(in srgb,var(--wrap),var(--D))}.s-cloth-dd{stroke:color-mix(in srgb,var(--cloth),var(--DD))}.s-hair-l{stroke:color-mix(in srgb,var(--hair),var(--L))}.s-main-d{stroke:color-mix(in srgb,var(--main),var(--D))}.s-skin{stroke:var(--skin)}.s-skin-d{stroke:color-mix(in srgb,var(--skin),var(--D))}.s-wood{stroke:var(--wood)}.s-wood-dd{stroke:color-mix(in srgb,var(--wood),var(--DD))}.s-wood-l{stroke:color-mix(in srgb,var(--wood),var(--L))}.s-wrap-dd{stroke:color-mix(in srgb,var(--wrap),var(--DD))}</style><g id="shadow"><ellipse cx="0" cy="0" rx="9" ry="2.6" fill="#1F2A44" opacity=".26"/></g><g id="body"><path d="M-1.9 -9L-2.2 -4.6 -2.4 -0.9" fill="none" stroke-width="3.8" class="s-skin-d"/><polygon points="-3.9,-1.6 1.4,-0.8 1.2,0.1 -4.1,0.1" class="f-wood-dd"/><path d="M2 -9L2.4 -4.6 2.8 -0.9" fill="none" stroke-width="3.8" class="s-skin"/><polygon points="1.3,-1.6 6.6,-0.8 6.4,0.1 1.1,0.1" class="f-wood-d"/><path d="M-1.6 -23.4L-8 -23" fill="none" stroke-width="1" class="s-wood-dd"/><polygon points="-11.6,-23 -4.6,-23 -4,-10 -12,-10.6" class="f-wrap-d"/><path d="M-11.4 -19.5L-4.4 -19.3M-11.4 -16L-4.4 -15.8M-11.4 -12.8L-4.4 -12.6M-9.6 -22.8L-9.3 -10.4M-7.2 -22.8L-6.9 -10.4" fill="n