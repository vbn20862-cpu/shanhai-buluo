<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -70 60 80"><title>阿美族 部落青年 出擊</title><style>svg{--cloth:#8C7356;--hair:#2B211B;--main:#2F78C2;--skin:#B9845A;--tip:#C9C4B4;--wood:#7A5534;--wrap:#CDB98E}.f-cloth{fill:var(--cloth)}.f-cloth-d{fill:color-mix(in srgb,var(--cloth),#26304A 30%)}.f-hair{fill:var(--hair)}.f-main{fill:var(--main)}.f-main-d{fill:color-mix(in srgb,var(--main),#26304A 30%)}.f-main-l{fill:color-mix(in srgb,var(--main),#FFF1CF 22%)}.f-skin{fill:var(--skin)}.f-skin-d{fill:color-mix(in srgb,var(--skin),#26304A 30%)}.f-tip{fill:var(--tip)}.f-wrap{fill:var(--wrap)}.s-skin{stroke:var(--skin)}.s-skin-d{stroke:color-mix(in srgb,var(--skin),#26304A 30%)}.s-wood{stroke:var(--wood)}</style><g id="shadow"><ellipse cx="0" cy="0" rx="9" ry="2.6" fill="#1F2A44" opacity=".26"/></g><g id="body"><path d="M-1.6 -8L-12.5 0" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" class="s-skin-d"/><path d="M2.2 -8L9.5 -6.5 10.5 0" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" class="s-skin"/><polygon points="-2.7,-12.2 6.8,-6.7 4,-0.5 -6.6,-6.6" class="f-cloth"/><polygon points="3,-8.9 6.8,-6.7 4,-0.5 0,-2.8" class="f-cloth-d"/><path d="M2.5 -17.5L2.1 -10.6 2.7 -10.8" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="s-skin-d"/><polygon points="2.3,-19.7 10.8,-14.8 6.3,-5.8 -3.1,-11.2" class="f-main"/><polygon points="7.5,-16.7 10.8,-14.8 6.3,-5.8 2.9,-7.8" class="f-main-d"/><polygon points="2.3,-19.7 6.1,-17.5 4.9,-16.5 1.6,-18.5" class="f-main-l"/><polygon points="2.3,-19.7 5.1,-18.1 6.9,-7.1 6,-5.4 3.5,-7.2" class="f-wrap"/><circle cx="8.8" cy="-23.2" r="6" class="f-hair"/><circle cx="9.6" cy="-21.2" r="5.7" class="f-skin"/><polygon points="14.1,-23.7 15.1,-19.8 13.2,-16.6 10.2,-16.1" class="f-skin-d"/><path d="M8.9 -13.8L11.2 -9.4" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="s-skin"/></g><g id="band" fill="currentColor"><polygon points="4.5,-27 16.7,-22.2 15.5,-19.9 3.4,-24.6" fill="currentColor"/><polygon points="-2,-13.6 7.7,-8 6.3,-5.4 -3.5,-11.1" fill="currentColor"/></g><g id="weapon"><path d="M-6.1 -12.2L27.9 -6.6" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="s-wood"/><polygon points="34.9,-5.4 27.6,-4.6 28.3,-8.5" class="f-tip"/></g></svg>
