<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -70 60 80"><title>排灣族 石牆守衛 出擊</title><style>svg{--cloth:#8C7356;--hair:#2B211B;--main:#C9962B;--skin:#B9845A;--tip:#C9C4B4;--wood:#7A5534}.f-cloth{fill:var(--cloth)}.f-cloth-d{fill:color-mix(in srgb,var(--cloth),#26304A 30%)}.f-hair{fill:var(--hair)}.f-main{fill:var(--main)}.f-main-d{fill:color-mix(in srgb,var(--main),#26304A 30%)}.f-main-l{fill:color-mix(in srgb,var(--main),#FFF1CF 22%)}.f-skin{fill:var(--skin)}.f-skin-d{fill:color-mix(in srgb,var(--skin),#26304A 30%)}.f-tip{fill:var(--tip)}.f-wood{fill:var(--wood)}.f-wood-d{fill:color-mix(in srgb,var(--wood),#26304A 30%)}.s-skin{stroke:var(--skin)}.s-skin-d{stroke:color-mix(in srgb,var(--skin),#26304A 30%)}.s-wood{stroke:var(--wood)}.s-wood-dd{stroke:color-mix(in srgb,var(--wood),#1C2234 52%)}</style><g id="shadow"><ellipse cx="0" cy="0" rx="9" ry="2.6" fill="#1F2A44" opacity=".26"/></g><g id="body"><path d="M-1.6 -8L-12.5 0" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" class="s-skin-d"/><path d="M2.2 -8L9.5 -6.5 10.5 0" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" class="s-skin"/><polygon points="-3.5,-12.7 6.7,-8.6 4.7,-2.1 -6.6,-6.7" class="f-cloth"/><polygon points="2.6,-10.3 6.7,-8.6 4.7,-2.1 0.4,-3.8" class="f-cloth-d"/><path d="M0.9 -18.7L1.7 -13.9 4.7 -15.9" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="s-skin-d"/><polygon points="0.4,-20.9 9.5,-17.2 6.2,-7.7 -3.8,-11.8" class="f-main"/><polygon points="6,-18.6 9.5,-17.2 6.2,-7.7 2.6,-9.2" class="f-main-d"/><polygon points="0.4,-20.9 4.4,-19.2 3.4,-18.1 -0.2,-19.6" class="f-main-l"/><circle cx="6.3" cy="-25.3" r="6" class="f-hair"/><circle cx="7.4" cy="-23.3" r="5.7" class="f-skin"/><polygon points="11.5,-26.5 13.1,-22.8 11.6,-19.4 8.7,-18.4" class="f-skin-d"/><path d="M7.7 -16L10 -10.5" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="s-skin"/></g><g id="band" fill