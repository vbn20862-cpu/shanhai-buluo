<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -70 60 80"><title>泰雅族 山林獵手 奔跑</title><style>svg{--cloth:#8C7356;--hair:#2B211B;--main:#B5483A;--skin:#B9845A;--tip:#C9C4B4;--wood:#7A5534;--wrap:#6E5440}.f-cloth{fill:var(--cloth)}.f-cloth-d{fill:color-mix(in srgb,var(--cloth),#26304A 30%)}.f-hair{fill:var(--hair)}.f-main{fill:var(--main)}.f-main-d{fill:color-mix(in srgb,var(--main),#26304A 30%)}.f-main-l{fill:color-mix(in srgb,var(--main),#FFF1CF 22%)}.f-skin{fill:var(--skin)}.f-skin-d{fill:color-mix(in srgb,var(--skin),#26304A 30%)}.f-tip{fill:var(--tip)}.f-wrap{fill:var(--wrap)}.s-skin{stroke:var(--skin)}.s-skin-d{stroke:color-mix(in srgb,var(--skin),#26304A 30%)}.s-wood{stroke:var(--wood)}</style><g id="shadow"><ellipse cx="0" cy="0" rx="9" ry="2.6" fill="#1F2A44" opacity=".26"/></g><g id="body"><path d="M-1.6 -9L-5.5 -4.5 -11.5 -3.5" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" class="s-skin-d"/><path d="M2.2 -9L8.5 -8.5 8.8 -0.5" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" class="s-skin"/><polygon points="-3.1,-13 6.8,-8.1 4.3,-1.8 -6.6,-7.1" class="f-cloth"/><polygon points="2.8,-10.1 6.8,-8.1 4.3,-1.8 0.2,-3.8" class="f-cloth-d"/><path d="M1.7 -18.6L-2.3 -13.7 -0.9 -11.9" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="s-skin-d"/><polygon points="1.4,-20.8 10.2,-16.5 6.3,-7.3 -3.4,-12" class="f-main"/><polygon points="6.8,-18.2 10.2,-16.5 6.3,-7.3 2.8,-9" class="f-main-d"/><polygon points="1.4,-20.8 5.2,-18.9 4.2,-17.9 0.7,-19.6" class="f-main-l"/><polygon points="1.3,-20.8 4.3,-19.4 6.8,-8.6 6,-6.8 3.4,-8.5" class="f-wrap"/><circle cx="7.6" cy="-24.8" r="6" class="f-hair"/><circle cx="8.5" cy="-22.8" r="5.7" class="f-skin"/><polygon points="12.9,-25.6 14.1,-21.8 12.4,-18.5 9.5,-17.7" class="f-skin-d"/><path d="M8.3 -15.4L7.6 -8.9" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="s-skin"/></g><g id="band" fill="currentColor"><polygon points="3,-28.2 15.6,-24.3 14.5,-21.9 2.1,-25.8" fill="currentColor"/><polygon points="-2.5,-14.4 7.6,-9.5 6.4,-6.8 -3.9,-11.8" fill="currentColor"/></g><g id="weapon"><path d="M-6.6 -13.9L15.1 -6.2" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="s-wood"/><polygon points="21.7,-3.8 14.4,-4.3 15.8,-8.1" class="f-tip"/></g></svg>
