<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -100 80 110"><title>排灣族 芭蕉</title><style>svg{--leaf:#6C9A48;--trunk:#7C8B4A;--D:#26304A 30%;--DD:#1C2234 52%;--L:#FFF1CF 22%} svg *{stroke-linecap:round;stroke-linejoin:round}.f-leaf{fill:var(--leaf)}.f-leaf-d{fill:color-mix(in srgb,var(--leaf),var(--D))}.f-leaf-l{fill:color-mix(in srgb,var(--leaf),var(--L))}.f-trunk{fill:var(--trunk)}.f-trunk-d{fill:color-mix(in srgb,var(--trunk),var(--D))}.s-leaf-dd{stroke:color-mix(in srgb,var(--leaf),var(--DD))}</style><g id="shadow"><ellipse cx="1.5" cy="0" rx="12" ry="3.6" fill="#1F2A44" opacity=".26"/></g><g id="body"><polygon points="-2.6,0 2.6,0 2,-30 -2,-30" class="f-trunk"/><polygon points="0.3,0 2.6,0 2,-30 0.4,-30" class="f-trunk-d"/><path d="M0 -30L-10.8 -41.2 -24.4 -29.1 -13.6 -33.7ZM0 -30L13.6 -33.7 24.4 -29.1 10.8 -41.2Z" class="f-leaf-d"/><path d="M0 -30L-3.6 -45.1 -13.8 -37.7 -10.2 -40.5ZM0 -30L10.4 -40.9 14.3 -38.4 3.9 -45.5Z" class="f-leaf"/><path d="M0 -30L3.6 -44.1 -0.8 -39.6 -4.4 -43.9Z" class="f-leaf-l"/><path d="M0 -30L-12.4 -38.2M0 -30L12.9 -38.7" fill="none" stroke-width="0.8" class="s-leaf-dd"/></g></svg>
