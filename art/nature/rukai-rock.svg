<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -100 80 110"><title>魯凱族 板岩片</title><style>svg{--stone:#56595B;--D:#26304A 30%;--DD:#1C2234 52%;--L:#FFF1CF 22%} svg *{stroke-linecap:round;stroke-linejoin:round}.f-stone{fill:var(--stone)}.f-stone-d{fill:color-mix(in srgb,var(--stone),var(--D))}.f-stone-dd{fill:color-mix(in srgb,var(--stone),var(--DD))}.f-stone-l{fill:color-mix(in srgb,var(--stone),var(--L))}.s-stone-dd{stroke:color-mix(in srgb,var(--stone),var(--DD))}</style><g id="shadow"><ellipse cx="1.5" cy="0" rx="14" ry="4.2" fill="#1F2A44" opacity=".26"/></g><g id="body"><polygon points="-13,0 -12,-5 9,-7 13,-2 10,1" class="f-stone-d"/><polygon points="-12,-5 -11,-8.4 7,-11 9,-7" class="f-stone"/><polygon points="-9,-8.6 -7,-11.6 4,-14.6 7,-11" class="f-stone-l"/><polygon points="5,-2 9,-9 16,-6 14,0" class="f-stone-dd"/><path d="M-12 -5L9 -7M-11 -8.4L7 -11M-7 -11.6L4 -14.6M-10 -2.6L8 -4.4" fill="none" stroke-width="0.8" class="s-stone-dd"/></g></svg>
