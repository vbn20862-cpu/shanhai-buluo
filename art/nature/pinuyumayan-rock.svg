<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -100 80 110"><title>卑南族 河床卵石</title><style>svg{--stone:#B3AD9E;--D:#26304A 30%;--L:#FFF1CF 22%;--LL:#FFF1CF 45%} svg *{stroke-linecap:round;stroke-linejoin:round}.f-stone{fill:var(--stone)}.f-stone-d{fill:color-mix(in srgb,var(--stone),var(--D))}.f-stone-l{fill:color-mix(in srgb,var(--stone),var(--L))}.f-stone-ll{fill:color-mix(in srgb,var(--stone),var(--LL))}</style><g id="shadow"><ellipse cx="1.5" cy="0" rx="15" ry="4.5" fill="#1F2A44" opacity=".26"/></g><g id="body"><ellipse cx="-6" cy="-4.4" rx="7.4" ry="4.6" class="f-stone-d"/><ellipse cx="5" cy="-3.6" rx="6.4" ry="3.8" class="f-stone"/><ellipse cx="-1" cy="-8.6" rx="6" ry="4" class="f-stone"/><ellipse cx="11" cy="-2.2" rx="3.4" ry="2.2" class="f-stone-l"/><ellipse cx="-13" cy="-2" rx="3.2" ry="2" class="f-stone"/><ellipse cx="-2.4" cy="-10.2" rx="2.6" ry="1.4" class="f-stone-ll"/><ellipse cx="3.6" cy="-5" rx="2.2" ry="1.1" class="f-stone-l"/><ellipse cx="-8" cy="-6.4" rx="2.4" ry="1.2" class="f-stone-l"/></g></svg>
