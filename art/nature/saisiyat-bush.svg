<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -100 80 110"><title>賽夏族 矮樹叢</title><style>svg{--leaf:#4E8040;--D:#26304A 30%;--L:#FFF1CF 22%} svg *{stroke-linecap:round;stroke-linejoin:round}.f-leaf{fill:var(--leaf)}.f-leaf-d{fill:color-mix(in srgb,var(--leaf),var(--D))}.f-leaf-l{fill:color-mix(in srgb,var(--leaf),var(--L))}</style><g id="shadow"><ellipse cx="1.5" cy="0" rx="12" ry="3.6" fill="#1F2A44" opacity=".26"/></g><g id="body"><ellipse cx="2.5" cy="-7" rx="11" ry="7" class="f-leaf-d"/><ellipse cx="-2" cy="-9" rx="8.5" ry="6.5" class="f-leaf"/><ellipse cx="6" cy="-10.5" rx="5.5" ry="4.5" class="f-leaf"/><ellipse cx="-3.5" cy="-12" rx="4" ry="3" class="f-leaf-l"/><ellipse cx="5" cy="-13" rx="2.4" ry="1.8" class="f-leaf-l"/></g></svg>
