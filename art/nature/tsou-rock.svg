<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -100 80 110"><title>鄒族 溪邊大石</title><style>svg{--stone:#9A988F;--D:#26304A 30%;--DD:#1C2234 52%;--L:#FFF1CF 22%} svg *{stroke-linecap:round;stroke-linejoin:round}.f-stone{fill:var(--stone)}.f-stone-d{fill:color-mix(in srgb,var(--stone),var(--D))}.f-stone-l{fill:color-mix(in srgb,var(--stone),var(--L))}.s-stone-dd{stroke:color-mix(in srgb,var(--stone),var(--DD))}</style><g id="shadow"><ellipse cx="1.5" cy="0" rx="18" ry="5.4" fill="#1F2A44" opacity=".26"/></g><g id="body"><polygon points="-16,0 -15,-10 -8,-20 4,-22 13,-16 16,-6 14,1" class="f-stone-d"/><polygon points="-16,0 -15,-10 -8,-20 4,-22 1,-12 -6,-2" class="f-stone"/><polygon points="-12,-12 -7,-18 2,-20 -2,-14" class="f-stone-l"/><path d="M1 -12L6 -6M-6 -2L1 -12" fill="none" stroke-width="0.8" class="s-stone-dd"/><ellipse cx="17" cy="-2.6" rx="5" ry="3.4" class="f-stone"/><ellipse cx="16" cy="-3.6" rx="2.6" ry="1.4" class="f-stone-l"/></g></svg>
