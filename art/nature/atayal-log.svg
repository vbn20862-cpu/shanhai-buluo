<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -100 80 110"><title>泰雅族 倒木</title><style>svg{--moss:#6F8F44;--trunk:#6E5440}.f-moss{fill:var(--moss)}.f-moss-l{fill:color-mix(in srgb,var(--moss),#FFF1CF 22%)}.f-trunk{fill:var(--trunk)}.f-trunk-d{fill:color-mix(in srgb,var(--trunk),#26304A 30%)}.f-trunk-l{fill:color-mix(in srgb,var(--trunk),#FFF1CF 22%)}.s-trunk{stroke:var(--trunk)}.s-trunk-d{stroke:color-mix(in srgb,var(--trunk),#26304A 30%)}.s-trunk-dd{stroke:color-mix(in srgb,var(--trunk),#1C2234 52%)}</style><g id="shadow"><ellipse cx="1.5" cy="0" rx="32" ry="9.6" fill="#1F2A44" opacity=".26"/></g><g id="body"><polygon points="-30,-10 26,-12 28,-1 -30,1" class="f-trunk"/><polygon points="-30,-4 27,-5 28,-1 -30,1" class="f-trunk-d"/><path d="M-22 -7L-6 -8M4 -9L18 -10" fill="none" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" class="s-trunk-dd"/><ellipse cx="27" cy="-6.5" rx="4" ry="6.5" class="f-trunk-l"/><ellipse cx="27" cy="-6.5" rx="1.8" ry="3" fill="none" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" class="s-trunk-d"/><path d="M-8 -11L-12 -18" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="s-trunk"/><ellipse cx="-18" cy="-10.5" rx="7" ry="2.6" class="f-moss"/><ellipse cx="10" cy="-12" rx="4.5" ry="1.8" class="f-moss-l"/></g></svg>
