<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -100 80 110"><title>阿美族 礁石</title><style>svg{--stone:#A8A498;--D:#26304A 30%;--DD:#1C2234 52%;--L:#FFF1CF 22%} svg *{stroke-linecap:round;stroke-linejoin:round}.f-stone{fill:var(--stone)}.f-stone-d{fill:color-mix(in srgb,var(--stone),var(--D))}.f-stone-l{fill:color-mix(in srgb,var(--stone),var(--L))}.s-stone-dd{stroke:color-mix(in srgb,var(--stone),var(--DD))}</style><g id="shadow"><ellipse cx="1.5" cy="0" rx="12" ry="3.6" fill="#1F2A44" opacity=".26"/></g><g id="body"><polygon points="-11,0 -9,-10 -2,-16 7,-13 11,-4 9,1 -3,2" class="f-stone-d"/><polygon points="-11,0 -9,-10 -2,-16 0,-8 -3,1" class="f-stone"/><polygon points="-9,-10 -2,-16 7,-13 1,-10" class="f-stone-l"/><path d="M2 -9L4 -4 3 0M-6 -6L-5 -2" fill="none" stroke-width="0.9" class="s-stone-dd"/></g></svg>
