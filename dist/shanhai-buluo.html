<title>山海部落</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 山海部落 — 版面：橫式時左邊是場景（部落或地圖）、右邊是操作面板；直式時上下堆疊。單一深色主題。 */
:root {
  --bg: #14212A; --sea: #0F2430; --panel: #1C2E38; --raise: #24394A; --line: #30495A;

}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 13.5px; line-height: 1.5; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }

.brand { font-family: var(--display); font-size: 20px; letter-spacing: .08em; white-space: nowrap; }

.vname b { font-family: var(--display); font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 8em; }
.vname .sub { color: var(--mute); font-size: 12px; white-space: nowrap; }
.chip { display: flex; align-items: center; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px 2px 7px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip .lbl, .chip .cap { color: var(--mute); font-size: 11.5px; }
.ic { width: 15px; height: 15px; flex: none; }
.ic-food { color: var(--gold); } .ic-mat { color: #BBA88C; } .ic-sp { color: #E58A5C; } .ic-pop { color: #9CC7D8; } .ic-star { color: var(--ink); }
.spacer { flex: 1; }
.mode { font-size: 11.5px; color: var(--mute); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.turn { display: none; font-size: 11.5px; color: var(--gold); white-space: nowrap; }
.dot { width: 11px; height: 11px; border-radius: 3px; display: inline-block; flex: none; }

#scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#scene[data-scene="map"] #vsvg, #scene[data-scene="village"] #msvg { display: none; }
#vsvg { background: #2A3B33; font-family: var(--body); }
#msvg { touch-action: none; cursor: grab; font-family: var(--body); user-select: none; -webkit-user-select: none; }
.tile { cursor: pointer; }
.tile .plot { fill: rgba(255, 255, 255, .07); stroke: rgba(255, 255, 255, .28); stroke-width: 2; stroke-dasharray: 7 7; }
.tile:not(.empty) .plot { fill: rgba(0, 0, 0, .1); stroke: none; }
.tile.on .plot { fill: rgba(227, 179, 65, .22); stroke: var(--gold); stroke-width: 4; stroke-dasharray: none; }
.person { transition: transform 2.2s linear; pointer-events: none; }
.rlabel { font-size: calc(var(--u, 1) * 11px); font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: rgba(12, 28, 38, .85); stroke-width: calc(var(--u, 1) * 3px); stroke-linejoin: round; text-anchor: middle; pointer-events: none; }
.rlabel:not(.play) { fill: #D5DCD6; font-weight: 500; }
.far .rlabel.minor { display: none; }
.zsel { fill: rgba(227, 179, 65, .2); stroke: var(--gold); }
.sett { fill: var(--ink); stroke: var(--bg); }
.vm circle { stroke: var(--ink); }
.vm.me circle { stroke: var(--gold); }
.vm text { fill: var(--ink); paint-order: stroke; stroke: rgba(12, 28, 38, .85); stroke-linejoin: round; text-anchor: middle; font-weight: 500; pointer-events: none; }
.far .vm:not(.me) text { display: none; }
#tools { position: absolute; right: 8px; bottom: 8px; }
.zoom { display: flex; gap: 4px; }
.zoom button { min-width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: rgba(20, 33, 42, .88); color: var(--ink); font-size: 16px; padding: 0 8px; }
.zoom button:last-child { font-size: 12.5px; }

/* 面板 */
#panel { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
#tabs { display: flex; gap: 4px; }
#tabs button { flex: 1; border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 4px 0; color: var(--mute); font-weight: 700; letter-spacing: .1em; }
#tabs button[aria-pressed="true"] { background: var(--panel); color: var(--ink); border-color: var(--gold); }
#pbody { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; overscroll-behavior: contain; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.card.sel { border-color: var(--gold); }
h3 { font-family: var(--display); font-size: 16.5px; margin: 0 0 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; text-wrap: balance; }
h3 .lv { margin-left: auto; font-family: var(--body); font-size: 12px; font-weight: 500; color: var(--mute); }
.nat { font-family: var(--body); font-style: italic; font-weight: 500; font-size: .88em; color: var(--gold); }
p { margin: 4px 0; }
.eff.next { color: var(--good); }
.muted, .en { color: var(--mute); font-size: 12.5px; }
.note { color: var(--mute); font-size: 12.5px; border-top: 1px dashed var(--line); padding-top: 6px; margin: 8px 0 0; }
.why { color: var(--warn); font-size: 12.5px; }
.busyline b, .qrow b { font-variant-numeric: tabular-nums; }
.hint { color: var(--mute); margin: 2px 0; }
.label { font-size: 11.5px; letter-spacing: .12em; color: var(--mute); margin: 6px 0 0; }
.act { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.btn { border: 0; border-radius: 8px; background: var(--gold); color: #2A1F05; font-weight: 700; padding: 6px 13px; }
.btn.sm { padding: 4px 12px; }
.btn.big { width: 100%; padding: 10px; font-size: 15px; margin-top: 8px; }
.start .btn.big { position: sticky; bottom: 0; box-shadow: 0 -10px 12px 4px var(--bg); }
.start .btn.big:disabled { opacity: 1; background: #5B5340; color: #1F1A0C; }
.btn.ghost { background: transparent; color: var(--mute); border: 1px solid var(--line); font-weight: 500; }
.btn:disabled { opacity: .42; }
.costs { display: flex; gap: 9px; flex-wrap: wrap; }
.cost { display: inline-flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
.cost.lack { color: var(--warn); }
.time { margin-left: auto; color: var(--mute); font-size: 12px; white-space: nowrap; }
.opts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.opts li { border-top: 1px dashed var(--line); padding-top: 8px; }

.opt-top { display: flex; justify-content: space-between; gap: 8px; }
.cnt { color: var(--mute); font-size: 12px; font-variant-numeric: tabular-nums; }
.job { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.jn { flex: 1; min-width: 0; }
.stepper { display: flex; align-items: center; gap: 5px; }
.stepper button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); font-size: 17px; line-height: 1; padding: 0; }
.stepper button:disabled { opacity: .4; }
.stepper b { min-width: 2.8em; text-align: center; font-variant-numeric: tabular-nums; }
.rate { color: var(--good); font-size: 12px; min-width: 3.8em; text-align: right; font-variant-numeric: tabular-nums; }
.switch { margin-left: auto; font-family: var(--body); font-size: 12px; font-weight: 500; color: var(--mute); display: flex; align-items: center; gap: 5px; cursor: pointer; }
.switch input { accent-color: var(--gold); width: 15px; height: 15px; margin: 0; }
.qrow { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
.qrow b { color: var(--gold); font-weight: 500; white-space: nowrap; }
.chipst { margin-left: auto; font-family: var(--body); font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--mute); white-space: nowrap; }
.chipst.on { background: var(--gold); border-color: var(--gold); color: #2A1F05; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; margin: 6px 0 0; }

.facts dd { margin: 0; }

.start { display: flex; flex-direction: column; gap: 6px; }
.start h1 { font-family: var(--display); font-size: 26px; letter-spacing: .08em; margin: 0; line-height: 1.2; }
.lead { color: var(--mute); margin: 0; }
.fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.fields label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--mute); }
.fields input { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; color: var(--ink); font-size: 14px; min-width: 0; }
.picks { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
.pick { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 0 7px; text-align: left; border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 9px; }
.pick span:last-child { grid-column: 2; color: var(--mute); font-size: 12px; }
.pick[aria-pressed="true"] { background: var(--panel); border-color: var(--gold); }
.tlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.tlist li { display: flex; gap: 8px; align-items: baseline; }
.tlist p { margin: 0; color: var(--mute); font-size: 12.5px; }

/* 提示訊息 */

.toast.bad { background: #F4C7B8; }

@media (max-width: 860px) { .chip .lbl { display: none; } }

@media (orientation: portrait) {

  #scene { aspect-ratio: 16 / 10; max-width: 100%; }
  #hud { flex-wrap: wrap; }
  .turn { display: block; }
}
@media (prefers-reduced-motion: reduce) { .person { transition: none; } }

<script>
/* 山海部落 — 遊戲規則與世界模擬
 * 伺服器用它當唯一的裁判；單機試玩版在瀏覽器裡跑同一份程式。 */
(function (root, factory) {

})(typeof self !== 'undefined' ? self : this, function (Geo, Tribes) {
  'use strict';

  // ---------- 規則數值 ----------
  var GRID_W = 9, GRID_H = 5, TILE_N = GRID_W * GRID_H, CENTER_TILE = 22;
  var MULT = [1, 2.2, 4, 7, 11], TMULT = [1, 2, 3.5, 5.5, 8], MAX_LEVEL = 5;
  var TYPES = ['house', 'farm', 'mat', 'special', 'storage', 'barracks', 'tower'];
  var DEF = {
    house: { base: { food: 15, mat: 40 }, time: 8 },
    farm: { base: { food: 0, mat: 35 }, time: 8 },
    mat: { base: { food: 35, mat: 0 }, time: 8 },
    special: { base: { food: 60, mat: 60 }, time: 14 },
    storage: { base: { food: 30, mat: 70 }, time: 12 },
    barracks: { base: { food: 80, mat: 80 }, time: 16 },
    tower: { base: { food: 20, mat: 90 }, time: 14 },

  // 部落中心升級：除了糧食與建材，還需要「別族的特產」，鼓勵交易與往來
  var CENTER_UP = {
    2: { food: 150, mat: 150, time: 20, kinds: 0, each: 0 },
    3: { food: 400, mat: 400, time: 45, kinds: 1, each: 5 },
    4: { food: 900, mat: 900, time: 90, kinds: 2, each: 8 },
    5: { food: 1800, mat: 1800, time: 150, kinds: 3, each: 12 }
  };
  var UNIT = {
    w: { zh: '勇士', atk: 10, hp: 30, cost: { food: 30, mat: 0 }, time: 5 },
    a: { zh: '弓手', atk: 12, hp: 18, cost: { food: 20, mat: 20 }, time: 5 }
  };
  var RATE = { food: 0.35, mat: 0.35, special: 0.03 };   // 每位族人每秒
  var FOREIGN_SP = false;   // 階段 4 加入交易後改成 true：部落中心升級要用別族的特產
  var BUILDERS = 2, SHIELD_MS = 180000, NEWBIE_MS = 300000, OFFER_MS = 600000;
  var BOT_NAMES = {
    atayal: ['霧林部落', '溪谷部落'], bunun: ['雲海部落', '楓林部落'],
    amis: ['浪花部落', '月桃部落'], paiwan: ['晨曦部落', '山風部落']
  };
  var PHRASES = { hello: 1, thanks: 1, trade: 1, ally: 1, cheer: 1, nice: 1 };

  function r5(n) { return Math.round(n / 5) * 5; }
  function cost(type, level) {
    if (type === 'center') { var c = CENTER_UP[level]; return c ? { food: c.food, mat: c.mat } : null; }
    var d = DEF[type], m = MULT[level - 1];
    return { food: r5(d.base.food * m), mat: r5(d.base.mat * m) };
  }
  function buildTime(type, level) {
    if (type === 'center') return CENTER_UP[level].time;
    return Math.round(DEF[type].time * TMULT[level - 1]);
  }
  function limit(type, C) {
    switch (type) {
      case 'house': case 'farm': case 'mat': return C + 1;
      case 'special': case 'storage': return 1 + Math.floor(C / 2);
      case 'barracks': return 1;
      case 'tower': return Math.max(0, C - 1);
    }
    return 0;
  }
  function centerLevel(v) { return v.tiles[CENTER_TILE].level; }
  function count(v, type) { var n = 0; for (var i = 0; i < TILE_N; i++) if (v.tiles[i] && v.tiles[i].type === type) n++; return n; }
  function sumLevels(v, type) { var n = 0; for (var i = 0; i < TILE_N; i++) if (v.tiles[i] && v.tiles[i].type === type) n += v.tiles[i].level; return n; }
  function levelsOf(v, type) { var a = []; for (var i = 0; i < TILE_N; i++) if (v.tiles[i] && v.tiles[i].type === type && v.tiles[i].level > 0) a.push(v.tiles[i].level); return a; }
  function popCap(v) { var n = 4; levelsOf(v, 'house').forEach(function (l) { n += 1 + 2 * l; }); return n; }
  function slots(v) { return { food: sumLevels(v, 'farm') * 2, mat: sumLevels(v, 'mat') * 2, special: sumLevels(v, 'special') * 2 }; }
  function caps(v) {
    var C = centerLevel(v), st = sumLevels(v, 'storage');
    return { res: 300 + 200 * C + 400 * st, sp: 20 + 20 * C + 20 * st, protect: 50 * C + 100 * st };
  }
  function armyCap(v) { return sumLevels(v, 'barracks') * 6; }
  function armyTotal(v) { return v.units.w + v.units.a + v.away.w + v.away.a + v.train.length; }
  function rates(v, speed) {
    var s = slots(v), t = Tribes.get(v.tribe), b = t && t.bonus, out = {};
    ['food', 'mat', 'special'].forEach(function (k) {
      var m = b && b.key === k ? b.mult : 1;
      out[k] = Math.min(v.jobs[k], s[k]) * RATE[k] * m * speed;
    });
    return out;
  }
  function foreignKinds(v) { var n = 0; for (var k in v.sp) if (k !== v.tribe && v.sp[k] >= 1) n++; return n; }
  function prosperity(v) {
    var p = 0;
    for (var i = 0; i < TILE_N; i++) if (v.tiles[i]) p += v.tiles[i].level * (v.tiles[i].type === 'center' ? 30 : 10);
    return Math.round(p + v.wall * 10 + v.pop * 3 + foreignKinds(v) * 15 + Math.min(40, v.gifts * 2));
  }
  function derived(v, speed) {
    var c = caps(v);
    return { cap: c.res, spCap: c.sp, protect: c.protect, slots: slots(v), rates: rates(v, speed), popCap: popCap(v),
      armyCap: armyCap(v), builders: BUILDERS, prosperity: prosperity(v), center: centerLevel(v) };
  }
  function getRes(v, k) { return k === 'food' || k === 'mat' ? v.res[k] : (v.sp[k.slice(3)] || 0); }
  function addRes(v, k, n) {
    if (k === 'food' || k === 'mat') v.res[k] = Math.max(0, v.res[k] + n);
    else { var id = k.slice(3); v.sp[id] = Math.max(0, (v.sp[id] || 0) + n); if (v.sp[id] < 1e-9) delete v.sp[id]; }
  }
  function validKey(k) { return k === 'food' || k === 'mat' || (typeof k === 'string' && k.slice(0, 3) === 'sp:' && !!Tribes.get(k.slice(3))); }
  function resName(k, tribeId) {
    if (k === 'food') return '糧食'; if (k === 'mat') return '建材';
    var t = Tribes.get(k.slice(3)); return t && t.sp ? t.sp.zh : '特產';
  }
  function can(v, c) { return v.res.food >= c.food && v.res.mat >= c.mat; }
  function pay(v, c) { v.res.food -= c.food; v.res.mat -= c.mat; }
  function clean(s, max) { return String(s == null ? '' : s).replace(/[<>&"'`\\\u0000-\u001f]/g, '').replace(/\s+/g, ' ').trim().slice(0, max); }
  function int(n) { n = Math.floor(Number(n)); return isFinite(n) ? n : 0; }

  // ---------- 戰鬥 ----------
  // 不呈現傷亡細節：失去戰力的單位視為「負傷撤退」。
  function battle(att, def, rng) {
    var A = { w: att.w, a: att.a }, D = { w: def.w, a: def.a };
    var wall = def.wallHp, towers = def.towers.map(function (L) { return { L: L, hp: 60 * L }; });
    var rounds = [], aPool = 0, dPool = 0;
    function towersUp() { return towers.filter(function (t) { return t.hp > 0; }); }
    function done() { return wall <= 0 && D.w + D.a === 0 && towersUp().length === 0; }
    rounds.push({ r: 0, aw: A.w, aa: A.a, dw: D.w, da: D.a, wall: Math.round(wall), towers: towers.length });
    for (var r = 1; r <= 10 && !done(); r++) {
      var wallUp = wall > 0, f1 = 0.88 + rng() * 0.24, f2 = 0.88 + rng() * 0.24;
      var dmgDef = (towersUp().reduce(function (s, t) { return s + 9 * t.L; }, 0) + (wallUp ? 0 : D.w * UNIT.w.atk) + D.a * UNIT.a.atk * (wallUp ? 1.5 : 1)) * f2;
      if (wallUp) wall = Math.max(0, wall - (A.w * UNIT.w.atk + A.a * UNIT.a.atk * 0.5) * f1);
      else {
        dPool += (A.w * UNIT.w.atk + A.a * UNIT.a.atk) * f1;
        while (D.w > 0 && dPool >= UNIT.w.hp) { D.w--; dPool -= UNIT.w.hp; }
        if (D.w === 0) while (D.a > 0 && dPool >= UNIT.a.hp) { D.a--; dPool -= UNIT.a.hp; }

      }
      aPool += dmgDef;
      while (A.w > 0 && aPool >= UNIT.w.hp) { A.w--; aPool -= UNIT.w.hp; }
      if (A.w === 0) while (A.a > 0 && aPool >= UNIT.a.hp) { A.a--; aPool -= UNIT.a.hp; }
      rounds.push({ r: r, aw: A.w, aa: A.a, dw: D.w, da: D.a, wall: Math.round(wall), towers: towersUp().length });

  }

  // ---------- 世界 ----------
  function World(opts) {

  World.prototype.log = function (text, now, kind) {

  // 一格可以住好幾個部落（Geo.SLOTS 個）；回傳每格已用掉的位置
  World.prototype.hexSlots = function () {
    var m = {};
    for (var id in this.villages) { var v = this.villages[id]; (m[v.hex] = m[v.hex] || {})[v.slot || 0] = id; }

  World.prototype.pickHex = function (tribe, prefer) {
    var used = this.hexSlots(), byId = this.map.byId, self = this;
    function n(h) { return used[h] ? Object.keys(used[h]).length : 0; }
    var list = (this.map.regions[tribe] || []).filter(function (h) { return n(h) < Geo.SLOTS; });
    if (!list.length) return null;
    var hex;
    if (prefer && list.indexOf(prefer) >= 0) hex = prefer;
    else if (prefer && byId[prefer]) {   // 選的格子滿了，挑同區最近的
      var p = byId[prefer];
      hex = list.slice().sort(function (a, b) { return Geo.hexDist(p, byId[a]) - Geo.hexDist(p, byId[b]); })[0];
    } else {   // 沒指定就挑人最少的格子
      var min = Math.min.apply(null, list.map(n)), least = list.filter(function (h) { return n(h) === min; });
      hex = least[Math.floor(self.rng() * least.length)];
    }
    var slot = 0; while (used[hex] && used[hex][slot]) slot++;
    return { hex: hex, slot: slot, pos: Geo.slotPos(byId[hex], slot) };
  };
  World.prototype.createVillage = function (o, now) {
    var tiles = []; for (var i = 0; i < TILE_N; i++) tiles.push(null);
    tiles[CENTER_TILE] = { type: 'center', level: 1 };
    tiles[CENTER_TILE - 1] = { type: 'house', level: 1 };
    tiles[CENTER_TILE - GRID_W] = { type: 'farm', level: 1 };
    tiles[CENTER_TILE + GRID_W] = { type: 'mat', level: 1 };
    var v = {
      id: this.id('v'), name: o.name, owner: o.owner, tribe: o.tribe, hex: o.at.hex, slot: o.at.slot, pos: o.at.pos, bot: !!o.bot,
      createdAt: now, last: now, res: { food: 120, mat: 120 }, sp: {}, pop: 4, popAcc: 0,
      jobs: { food: 2, mat: 2, special: 0 }, auto: true, tiles: tiles, wall: 0, queue: [],
      units: { w: 0, a: 0 }, away: { w: 0, a: 0 }, train: [], glory: 0, wins: 0, losses: 0, gifts: 0,
      shieldUntil: 0, newbieUntil: o.bot ? 0 : now + NEWBIE_MS, ally: null, reports: [], cool: {},

  World.prototype.join = function (token, o, now) {
    token = clean(token, 64);
    if (!token) return { ok: false, msg: '缺少識別碼' };
    if (this.tokens[token] && this.villages[this.tokens[token]]) return { ok: true, id: this.tokens[token], resumed: true };
    o = o || {};
    var t = Tribes.get(o.tribe);
    if (!t) return { ok: false, msg: '請先在地圖上選一個區域' };
    if (!t.playable) return { ok: false, msg: t.zh + '的區域還在製作中，請先選其他區域' };
    var owner = clean(o.owner, 10) || '旅人', name = clean(o.name, 10) || (owner + '的部落');
    var at = this.pickHex(t.id, o.hex);
    if (!at) return { ok: false, msg: t.zh + '的區域已經住滿了，請選其他區域' };
    var v = this.createVillage({ name: name, owner: owner, tribe: t.id, at: at }, now);
    this.tokens[token] = v.id;

  World.prototype.ensureBots = function (now) {
    var self = this;

      var names = BOT_NAMES[t.id] || [];

  };

  // ---------- 單一部落的時間推進 ----------
  World.prototype.autoJobs = function (v) {
    var s = slots(v), j = { food: 0, mat: 0, special: 0 }, left = v.pop, order = ['food', 'mat', 'special'];

      var best = null, bestR = 2;
      for (var i = 0; i < 3; i++) { var k = order[i]; if (j[k] < s[k]) { var r = j[k] / s[k]; if (r < bestR) { bestR = r; best = k; } } }

      j[best]++; left--;

    v.jobs = j;
  };
  World.prototype.tickVillage = function (v, now) {
    var dt = Math.min((now - v.last) / 1000, 8 * 3600);
    if (dt <= 0) return;
    v.last = now;
    var self = this;
    v.queue = v.queue.filter(function (q) {
      if (q.doneAt > now) return true;
      if (q.type === 'wall') v.wall = q.to;
      else if (v.tiles[q.tile]) { v.tiles[q.tile].level = q.to; delete v.tiles[q.tile].busy; }
      return false;
    });
    v.train = v.train.filter(function (q) { if (q.doneAt > now) return true; v.units[q.u]++; return false; });
    var pc = popCap(v);
    if (v.pop < pc) {
      v.popAcc += dt * self.speed / 10;
      while (v.popAcc >= 1 && v.pop < pc) { v.pop++; v.popAcc -= 1; }
    } else v.popAcc = 0;
    if (v.auto) this.autoJobs(v);
    else {   // 手動分工：人數不能超過族人總數
      var sum = v.jobs.food + v.jobs.mat + v.jobs.special;
      ['special', 'mat', 'food'].forEach(function (k) { while (sum > v.pop && v.jobs[k] > 0) { v.jobs[k]--; sum--; } });
    }
    var rt = rates(v, this.speed), c = caps(v);
    ['food', 'mat'].forEach(function (k) { if (v.res[k] < c.res) v.res[k] = Math.min(c.res, v.res[k] + rt[k] * dt); });
    var own = v.sp[v.tribe] || 0;

  };

  // ---------- 玩家動作 ----------
  World.prototype.act = function (id, a, now) {
    var v = this.villages[id];

    var fn = ACTIONS[a.type];
    if (!fn) return { ok: false, msg: '不支援的動作' };

  };
  var ACTIONS = {
    auto: function (v, a) { v.auto = !!a.on; if (v.auto) this.autoJobs(v); },
    jobs: function (v, a) {

    build: function (v, a, now) {

      if (!can(v, c)) return { ok: false, msg: '糧食或建材不足' };

      v.tiles[tile] = { type: type, level: 0, busy: true };
      v.queue.push({ id: this.id('q'), tile: tile, type: type, to: 1, doneAt: now + buildTime(type, 1) * 1000 / this.speed });
    },
    upgrade: function (v, a, now) {
      var tile = int(a.tile), b = v.tiles[tile];
      if (!b) return { ok: false, msg: '這裡沒有建築' };
      if (b.busy) return { ok: false, msg: '還在施工中' };
      if (b.level >= MAX_LEVEL) return { ok: false, msg: '已經是最高等級' };
      if (v.queue.length >= BUILDERS) return { ok: false, msg: '同時只能進行 ' + BUILDERS + ' 項工程' };
      var to = b.level + 1, c = cost(b.type, to), picked = [], ownSp = 0;
      if (b.type === 'center') {
        var need = CENTER_UP[to];
        if (need.kinds > 0) {
          if (!FOREIGN_SP) {
            ownSp = need.each * need.kinds;
            if ((v.sp[v.tribe] || 0) < ownSp) return { ok: false, msg: '還需要 ' + ownSp + ' 份特產' };
          } else {
            var have = Object.keys(v.sp).filter(function (k) { return k !== v.tribe && v.sp[k] >= need.each; })
              .sort(function (x, y) { return v.sp[y] - v.sp[x]; });
            if (have.length < need.kinds) return { ok: false, msg: '還需要 ' + need.kinds + ' 種別族特產，每種 ' + need.each + ' 份（可以交易、送禮或出征取得）' };
            picked = have.slice(0, need.kinds);
          }
        }
      } else if (to > centerLevel(v)) return { ok: false, msg: '等級不能超過部落中心' };
      if (!can(v, c)) return { ok: false, msg: '糧食或建材不足' };
      pay(v, c);
      if (ownSp) addRes(v, 'sp:' + v.tribe, -ownSp);
      picked.forEach(function (k) { addRes(v, 'sp:' + k, -CENTER_UP[to].each); });
      b.busy = true;
      v.queue.push({ id: this.id('q'), tile: tile, type: b.type, to: to, doneAt: now + buildTime(b.type, to) * 1000 / this.speed });
    },
    wall: function (v, a, now) {
      if (v.queue.some(function (q) { return q.type === 'wall'; })) return { ok: false, msg: '還在施工中' };
      var to = v.wall + 1;
      if (to > centerLevel(v)) return { ok: false, msg: '等級不能超過部落中心' };
      if (v.queue.length >= BUILDERS) return { ok: false, msg: '同時只能進行 ' + BUILDERS + ' 項工程' };
      var c = cost('wall', to);
      if (!can(v, c)) return { ok: false, msg: '建材不足' };
      pay(v, c);
      v.queue.push({ id: this.id('q'), tile: -1, type: 'wall', to: to, doneAt: now + buildTime('wall', to) * 1000 / this.speed });
    },
    train: function (v, a, now) {
      var u = UNIT[a.u];
      if (!u) return { ok: false, msg: '沒有這種單位' };
      if (armyCap(v) === 0) return { ok: false, msg: '要先蓋好訓練場' };
      if (armyTotal(v) >= armyCap(v)) return { ok: false, msg: '人數已滿，升級訓練場可以增加名額' };
      if (!can(v, u.cost)) return { ok: false, msg: '糧食或建材不足' };
      pay(v, u.cost);
      var start = v.train.length ? v.train[v.train.length - 1].doneAt : now;
      v.train.push({ u: a.u, doneAt: Math.max(start, now) + u.time * 1000 / this.speed });
    },
    attack: function (v, a, now) {
      var t = this.villages[a.to], w = int(a.w), ar = int(a.a);
      if (!t || t.id === v.id) return { ok: false, msg: '找不到目標' };
      if (w < 0 || ar < 0 || w + ar < 1) return { ok: false, msg: '至少要派出一位勇士' };
      if (w > v.units.w || ar > v.units.a) return { ok: false, msg: '留在部落的人數不夠' };
      if (v.ally && v.ally === t.ally) return { ok: false, msg: '不能出征同一個聯盟的部落' };
      if (now < t.shieldUntil || now < t.newbieUntil) return { ok: false, msg: '對方正受到保護' };
      if (!t.bot && centerLevel(v) - centerLevel(t) > 1) return { ok: false, msg: '對方規模比你小太多，不能出征' };
      if ((v.cool[t.id] || 0) > now) return { ok: false, msg: '才剛交手過，晚一點再來' };
      if (this.marches.filter(function (m) { return m.from === v.id; }).length >= 2) return { ok: false, msg: '最多同時派出兩支隊伍' };
      v.units.w -= w; v.units.a -= ar; v.away.w += w; v.away.a += ar;
      v.newbieUntil = 0; v.shieldUntil = 0;
      var d = Geo.hexDist(this.map.byId[v.hex], this.map.byId[t.hex]);
      var travel = Math.min(60, 6 + 2.5 * d) * 1000 / this.speed;
      this.marches.push({ id: this.id('m'), from: v.id, to: t.id, w: w, a: ar, departAt: now, arriveAt: now + travel, travel: travel, phase: 'out', loot: null });
      v.cool[t.id] = now + 120000;
      return { ok: true, msg: '隊伍出發了' };
    },
    gift: function (v, a, now) {
      var t = this.villages[a.to], k = a.key, n = int(a.n);
      if (!t || t.id === v.id) return { ok: false, msg: '找不到對象' };
      if (!validKey(k) || n < 1 || n > 100) return { ok: false, msg: '一次可以送 1 到 100 份' };
      if (now - v.lastGift < 5000) return { ok: false, msg: '稍等一下再送' };
      if (getRes(v, k) < n) return { ok: false, msg: '數量不夠' };
      this.tickVillage(t, now);
      addRes(v, k, -n); addRes(t, k, n); v.lastGift = now; v.gifts++;
      this.log('「' + v.name + '」送給「' + t.name + '」' + n + ' 份' + resName(k) + '。', now, 'gift');
      return { ok: true, msg: '禮物送到了' };
    },
    offer: function (v, a, now) {
      var g = a.give, w = a.want, gn = int(a.giveN), wn = int(a.wantN);
      if (!validKey(g) || !validKey(w) || g === w) return { ok: false, msg: '請選兩種不同的物資' };
      if (gn < 1 || wn < 1 || gn > 500 || wn > 500) return { ok: false, msg: '數量要在 1 到 500 之間' };
      if (this.market.filter(function (o) { return o.from === v.id; }).length >= 3) return { ok: false, msg: '最多同時掛三筆交易' };
      if (getRes(v, g) < gn) return { ok: false, msg: '數量不夠' };
      addRes(v, g, -gn);
      this.market.push({ id: this.id('o'), from: v.id, give: g, giveN: gn, want: w, wantN: wn, t: now });
      return { ok: true, msg: '已經掛到市集' };
    },
    cancel: function (v, a) {
      var i = this.market.findIndex(function (o) { return o.id === a.id && o.from === v.id; });
      if (i < 0) return { ok: false, msg: '找不到這筆交易' };
      var o = this.market.splice(i, 1)[0]; addRes(v, o.give, o.giveN);
      return { ok: true, msg: '已取消，物資退回來了' };
    },
    accept: function (v, a, now) {
      var i = this.market.findIndex(function (o) { return o.id === a.id; });
      if (i < 0) return { ok: false, msg: '這筆交易已經不在了' };
      var o = this.market[i], s = this.villages[o.from];
      if (o.from === v.id) return { ok: false, msg: '這是你自己掛的交易' };
      if (getRes(v, o.want) < o.wantN) return { ok: false, msg: resName(o.want) + '不夠' };
      this.market.splice(i, 1);
      addRes(v, o.want, -o.wantN); addRes(v, o.give, o.giveN);
      if (s) { this.tickVillage(s, now); addRes(s, o.want, o.wantN); }
      this.log('「' + v.name + '」和「' + (s ? s.name : '遠方部落') + '」完成交易：' + o.giveN + ' ' + resName(o.give) + ' 換 ' + o.wantN + ' ' + resName(o.want) + '。', now, 'trade');
      return { ok: true, msg: '交易完成' };
    },
    allyCreate: function (v, a, now) {
      if (v.ally) return { ok: false, msg: '你已經在聯盟裡了' };
      var name = clean(a.name, 8);
      if (name.length < 2) return { ok: false, msg: '聯盟名稱至少兩個字' };
      for (var k in this.alliances) if (this.alliances[k].name === name) return { ok: false, msg: '已經有同名的聯盟' };
      var al = { id: this.id('a'), name: name, leader: v.id, members: [v.id] };
      this.alliances[al.id] = al; v.ally = al.id;
      this.log('「' + v.name + '」發起了聯盟「' + name + '」。', now, 'ally');
      return { ok: true, msg: '聯盟成立了' };
    },
    allyJoin: function (v, a, now) {
      var al = this.alliances[a.id];
      if (v.ally) return { ok: false, msg: '你已經在聯盟裡了' };
      if (!al) return { ok: false, msg: '找不到這個聯盟' };
      if (al.members.length >= 20) return { ok: false, msg: '這個聯盟滿了' };
      al.members.push(v.id); v.ally = al.id;
      this.log('「' + v.name + '」加入了聯盟「' + al.name + '」。', now, 'ally');
      return { ok: true, msg: '加入了' + al.name };
    },
    allyLeave: function (v) {
      var al = this.alliances[v.ally];
      if (!al) { v.ally = null; return { ok: false, msg: '你不在聯盟裡' }; }
      al.members = al.members.filter(function (m) { return m !== v.id; }); v.ally = null;
      if (!al.members.length) delete this.alliances[al.id]; else if (al.leader === v.id) al.leader = al.members[0];
      return { ok: true, msg: '已離開聯盟' };
    },
    say: function (v, a, now) {
      if (!PHRASES[a.phrase]) return { ok: false, msg: '沒有這句話' };
      if (now - v.lastSay < 4000) return { ok: false, msg: '說話慢一點' };
      v.lastSay = now;
      var t = Tribes.get(v.tribe), txt = {
        hello: t.hello + '！（' + t.lang + '的問候）', thanks: t.thanks + '！（' + t.lang + '的謝謝）',
        trade: '有人想交換特產嗎？', ally: '歡迎加入我們的聯盟！', cheer: '大家一起加油！', nice: '這場較量真精彩！'
      }[a.phrase];
      this.log('「' + v.name + '」：' + txt, now, 'say');
    }
  };

  // ---------- 出征隊伍 ----------
  World.prototype.resolveMarch = function (m, now) {
    var v = this.villages[m.from], t = this.villages[m.to];
    if (!v) return false;
    if (m.phase === 'back') {
      v.units.w += m.w; v.units.a += m.a; v.away.w = Math.max(0, v.away.w - m.w0); v.away.a = Math.max(0, v.away.a - m.a0);
      if (m.loot) for (var k in m.loot) addRes(v, k, m.loot[k]);
      return false;
    }
    m.w0 = m.w; m.a0 = m.a;
    var back = function () { m.phase = 'back'; m.departAt = now; m.arriveAt = now + m.travel; return true; };
    if (!t || now < t.shieldUntil || (v.ally && v.ally === t.ally)) {
      this.pushReport(v, { t: now, role: 'atk', other: t ? t.name : '', win: false, note: '對方正受到保護，隊伍折返。', rounds: [] });
      return back();
    }
    this.tickVillage(v, now); this.tickVillage(t, now);
    var res = battle({ w: m.w, a: m.a }, { w: t.units.w, a: t.units.a, wallHp: t.wall * 80, towers: levelsOf(t, 'tower') }, this.rng);
    var lostA = { w: m.w - res.A.w, a: m.a - res.A.a }, lostD = { w: t.units.w - res.D.w, a: t.units.a - res.D.a };
    t.units.w = res.D.w; t.units.a = res.D.a;
    v.away.w -= lostA.w; v.away.a -= lostA.a; m.w0 = res.A.w; m.a0 = res.A.a;
    m.w = res.A.w; m.a = res.A.a;
    var loot = {}, lootTxt = [];
    if (res.win) {
      // 每位回程的勇士能背 30 份：先帶特產，剩下的空間平均分給糧食與建材
      var prot = caps(t).protect, carry = 30 * (m.w + m.a), want = {}, take = function (k2, n) {
        n = Math.min(n, carry); if (n <= 0) return;
        carry -= n; loot[k2] = n; addRes(t, k2, -n); lootTxt.push(n + ' ' + resName(k2));
      };
      for (var sk in t.sp) take('sp:' + sk, Math.floor(t.sp[sk] * 0.3));
      ['food', 'mat'].forEach(function (k) { want[k] = Math.floor(Math.max(0, t.res[k] - prot) * 0.35); });
      var total = want.food + want.mat, f = total > carry ? carry / total : 1;
      var nf = Math.floor(want.food * f), nm = Math.floor(want.mat * f);
      take('food', nf); take('mat', nm);
      m.loot = loot;
      v.wins++; t.losses++; v.glory += 10 + 2 * centerLevel(t); t.glory = Math.max(0, t.glory - 3);
      t.shieldUntil = now + SHIELD_MS;
      this.log('「' + v.name + '」出征「' + t.name + '」獲勝' + (lootTxt.length ? '，帶回 ' + lootTxt.join('、') : '') + '。', now, 'battle');
    } else {
      v.losses++; t.wins++; t.glory += 5; v.glory = Math.max(0, v.glory - 2);
      this.log('「' + t.name + '」守住了「' + v.name + '」的出征。', now, 'battle');
    }
    var rid = this.id('r');
    this.pushReport(v, { id: rid, t: now, role: 'atk', other: t.name, otherTribe: t.tribe, win: res.win, rounds: res.rounds, loot: loot, lost: lostA });
    this.pushReport(t, { id: rid, t: now, role: 'def', other: v.name, otherTribe: v.tribe, win: !res.win, rounds: res.rounds, loot: loot, lost: lostD });
    if (m.w + m.a === 0) return false;
    return back();
  };
  World.prototype.pushReport = function (v, rep) {
    rep.id = rep.id || this.id('r'); rep.seen = false;
    v.reports.unshift(rep); if (v.reports.length > 8) v.reports.length = 8;
  };

  // ---------- 示範部落（電腦） ----------
  World.prototype.botStep = function (v, now) {
    var self = this, rng = this.rng, C = centerLevel(v);
    this.tickVillage(v, now);
    if (v.queue.length < BUILDERS && rng() < 0.7) {
      var opts = [], empty = [];
      for (var i = 0; i < TILE_N; i++) {
        var b = v.tiles[i];
        if (!b) { empty.push(i); continue; }
        if (b.busy || b.level >= MAX_LEVEL) continue;
        if (b.type === 'center') { if (can(v, cost('center', b.level + 1))) opts.push({ type: 'upgrade', tile: i }, { type: 'upgrade', tile: i }); }
        else if (b.level < C && can(v, cost(b.type, b.level + 1))) opts.push({ type: 'upgrade', tile: i });
      }
      if (empty.length) TYPES.forEach(function (ty) {
        if (count(v, ty) < limit(ty, C) && can(v, cost(ty, 1))) opts.push({ type: 'build', type2: ty, tile: empty[Math.floor(rng() * empty.length)] });
      });
      if (v.wall < C && can(v, cost('wall', v.wall + 1))) opts.push({ type: 'wall' });
      if (opts.length) this.act(v.id, opts[Math.floor(rng() * opts.length)], now);
    }
    if (armyCap(v) > armyTotal(v) && rng() < 0.5) this.act(v.id, { type: 'train', u: rng() < 0.6 ? 'w' : 'a' }, now);
    var mine = this.market.filter(function (o) { return o.from === v.id; });
    if (!mine.length && (v.sp[v.tribe] || 0) >= 6 && rng() < 0.25) {
      var others = Tribes.playable().filter(function (t) { return t.id !== v.tribe; });
      var wantSp = rng() < 0.5;
      this.act(v.id, wantSp ? { type: 'offer', give: 'sp:' + v.tribe, giveN: 4, want: 'sp:' + others[Math.floor(rng() * others.length)].id, wantN: 4 }
        : { type: 'offer', give: 'sp:' + v.tribe, giveN: 4, want: rng() < 0.5 ? 'food' : 'mat', wantN: 60 }, now);
    }
    this.market.slice().forEach(function (o) {
      if (o.from === v.id || rng() > 0.2) return;
      var fair = o.give.slice(0, 3) === 'sp:' && o.give !== 'sp:' + v.tribe &&
        ((o.want === 'food' || o.want === 'mat') ? o.wantN / o.giveN <= 25 && v.res[o.want] > o.wantN + 150 : o.want === 'sp:' + v.tribe && o.wantN <= o.giveN * 1.5);
      if (fair && getRes(v, o.want) >= o.wantN) self.act(v.id, { type: 'accept', id: o.id }, now);
    });
  };

  // ---------- 世界時間推進 ----------
  World.prototype.tick = function (now) {
    var self = this, id;
    for (id in this.villages) { var v = this.villages[id]; if (v.online || v.bot) this.tickVillage(v, now); }
    this.marches = this.marches.filter(function (m) { return m.arriveAt > now ? true : self.resolveMarch(m, now); });
    this.market = this.market.filter(function (o) {
      if (now - o.t < OFFER_MS) return true;
      var s = self.villages[o.from]; if (s) addRes(s, o.give, o.giveN);
      return false;
    });
    if (now - this.lastBot >= 4000 / this.speed) {
      this.lastBot = now;
      for (id in this.villages) if (this.villages[id].bot) this.botStep(this.villages[id], now);
    }
  };

  // ---------- 給客戶端的資料 ----------
  World.prototype.pub = function (v, now) {
    var guard = v.units.w + v.units.a;
    return { id: v.id, name: v.name, owner: v.owner, tribe: v.tribe, hex: v.hex, pos: v.pos, bot: v.bot, online: v.online || v.bot,
      c: centerLevel(v), wall: v.wall, towers: levelsOf(v, 'tower').length, guard: guard === 0 ? 0 : guard <= 4 ? 1 : guard <= 10 ? 2 : 3,
      pros: prosperity(v), glory: v.glory, ally: v.ally, safe: Math.max(v.shieldUntil, v.newbieUntil) };
  };
  World.prototype.detail = function (id, now) {
    var v = this.villages[id]; if (!v) return null;
    this.tickVillage(v, now);
    var p = this.pub(v, now);
    p.tiles = v.tiles.map(function (b) { return b ? { type: b.type, level: b.level, busy: !!b.busy } : null; });
    p.pop = v.pop;
    return p;
  };
  World.prototype.snapshot = function (id, now) {
    var v = this.villages[id], self = this;
    if (!v) return null;
    var me = JSON.parse(JSON.stringify(v));
    me.d = derived(v, this.speed);
    var al = {};
    for (var k in this.alliances) al[k] = { id: k, name: this.alliances[k].name, leader: this.alliances[k].leader, n: this.alliances[k].members.length };
    return {
      now: now, speed: this.speed, me: me,
      villages: Object.keys(this.villages).map(function (k) { return self.pub(self.villages[k], now); }),
      marches: this.marches.map(function (m) { return { id: m.id, from: m.from, to: m.to, departAt: m.departAt, arriveAt: m.arriveAt, phase: m.phase, n: m.w + m.a }; }),
      market: this.market.map(function (o) { return { id: o.id, from: o.from, fromName: (self.villages[o.from] || {}).name || '', give: o.give, giveN: o.giveN, want: o.want, wantN: o.wantN }; }),
      feed: this.feed.slice(-30), alliances: al
    };
  };
  World.prototype.toJSON = function () {
    return { villages: this.villages, tokens: this.tokens, marches: this.marches, market: this.market, feed: this.feed, alliances: this.alliances, seq: this.seq };
  };
  World.prototype.load = function (d) {
    if (!d || !d.villages) return this;
    this.villages = d.villages; this.tokens = d.tokens || {}; this.marches = d.marches || []; this.market = d.market || [];
    this.feed = d.feed || []; this.alliances = d.alliances || {}; this.seq = d.seq || 1;
    for (var id in this.villages) { this.villages[id].online = !!this.villages[id].bot; }
    return this;
  };

  World.rules = {
    GRID_W: GRID_W, GRID_H: GRID_H, TILE_N: TILE_N, CENTER_TILE: CENTER_TILE, TYPES: TYPES, MAX_LEVEL: MAX_LEVEL, UNIT: UNIT,
    CENTER_UP: CENTER_UP, BUILDERS: BUILDERS, FOREIGN_SP: FOREIGN_SP, cost: cost, buildTime: buildTime, limit: limit, count: count,
    resName: resName, battle: battle, derived: derived, popCap: popCap
  };
  return World;
});

<script>
/* 山海部落 — 畫面繪製（全部用 SVG 即時畫出，沒有外部圖檔）
 * 圖樣只用一般的幾何形狀，不使用各族專屬或具身分意義的紋樣。 */
window.Art = (function () {
  'use strict';
  var R = World.rules, INK = '#14212A', CREAM = '#F2EAD6';

  function shade(hex, p) {
    var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255, t = p < 0 ? 0 : 255, a = Math.abs(p) / 100;
    r = Math.round(r + (t - r) * a); g = Math.round(g + (t - g) * a); b = Math.round(b + (t - b) * a);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function token() {
    var t = store(TOKEN_KEY) || memToken;
    if (!t) {
      t = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
      memToken = t; store(TOKEN_KEY, t);
    }
    return t;
  }

  // ----- 單機 -----
  function startLocal() {
    mode = 'solo';
    local = new World({ speed: 1 });
    var saved = store(SAVE_KEY);
    if (!saved && window.claude && window.claude.hot && window.claude.hot.data && window.claude.hot.data.world) saved = window.claude.hot.data.world;
    if (saved) { try { local.load(JSON.parse(saved)); } catch (e) { /* 壞掉的存檔就重新開始 */ } }
    var now = Date.now();
    local.ensureBots(now);
    localId = local.tokens.solo && local.villages[local.tokens.solo] ? local.tokens.solo : null;
    if (localId) local.villages[localId].online = true;
    fire('status', { online: true, mode: mode });
    fire('hello', { villages: pubs(now), resumed: !!localId });
    var n = 0;
    setInterval(function () {
      var t = Date.now();
      local.tick(t);
      if (localId) fire('state', local.snapshot(localId, t)); else fire('hello', { villages: pubs(t), resumed: false });
      if (++n % 10 === 0) save();
    }, 1000);
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function () { return { world: JSON.stringify(local.toJSON()) }; });
  }
  function pubs(now) { return Object.keys(local.villages).map(function (k) { return local.pub(local.villages[k], now); }); }
  function save() { store(SAVE_KEY, JSON.stringify(local.toJSON())); }

  // ----- 連線 -----
  function startOnline() {
    mode = 'online';
    socket = window.io({ transports: ['websocket', 'polling'] });
    socket.on('connect', function () {
      fire('status', { online: true, mode: mode });
      socket.emit('resume', { token: token() }, function (r) { fire('hello', r || { villages: [] }); });
    });
    socket.on('disconnect', function () { fire('status', { online: false, mode: mode }); });
    socket.on('state', function (s) { fire('state', s); });
    socket.on('hello', function (h) { fire('hello', h); });
  }

  return {
    on: on,
    mode: function () { return mode; },
    start: function () { if (window.io) startOnline(); else startLocal(); },
    join: function (o, cb) {
      if (mode === 'solo') {
        var now = Date.now(), r = local.join('solo', o, now);
        if (r.ok) { localId = r.id; local.villages[localId].online = true; save(); fire('state', local.snapshot(localId, now)); }
        cb(r);
      } else { o.token = token(); socket.emit('join', o, cb); }
    },
    act: function (a, cb) {
      cb = cb || function () {};
      if (mode === 'solo') {
        var now = Date.now(), r = local.act(localId, a, now);
        fire('state', local.snapshot(localId, now)); cb(r);
      } else socket.emit('act', a, cb);
    },
    view: function (id, cb) {
      if (mode === 'solo') cb(local.detail(id, Date.now())); else socket.emit('view', id, cb);
    },
    reset: function () {   // 只有單機試玩可以重來
      if (mode !== 'solo') return;
      try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* 沒有存檔可清 */ }
      local = new World({ speed: 1 }); localId = null; local.ensureBots(Date.now());
      fire('hello', { villages: pubs(Date.now()), resumed: false, reset: true });
    }
  };
})();
</script>
<script>
/* 山海部落 — 操作介面（階段 1：選區域落腳、部落經營、圖鑑） */
(function () {
  'use strict';
  var R = World.rules, G = Geo.build();
  var STAGE_TYPES = ['house', 'farm', 'mat', 'special', 'storage'];   // 這個階段開放的建築；軍事建築在對戰階段加入
  var JOBS = ['food', 'mat', 'special'], WILD = { fish: '漁場', hunt: '獵場', wood: '林地' };
  var S = { me: null, pubs: [], tab: 'build', zone: null, selTile: null, form: { owner: '', name: '' }, mode: '', online: false, resetAt: 0, joining: false };
  var el = {}, MV = { k: 1, cx: Geo.MAP_W / 2, cy: Geo.MAP_H / 2, s0: 1, vw: Geo.MAP_W, vh: Geo.MAP_H, ready: false };

  // ---------- 小工具 ----------
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function n0(x) { return Math.floor(x || 0); }
  function setHTML(node, html) { if (node._h === html) return false; node.innerHTML = html; node._h = html; return true; }
  function dur(sec) { sec = Math.max(0, Math.ceil(sec)); return sec < 60 ? sec + ' 秒' : Math.floor(sec / 60) + ' 分 ' + ('0' + sec % 60).slice(-2) + ' 秒'; }
  function toast(msg, bad) {
    var d = document.createElement('div'); d.className = 'toast' + (bad ? ' bad' : ''); d.textContent = msg;
    el.toast.appendChild(d); setTimeout(function () { d.remove(); }, 2600);
  }
  function scene() { return S.me && S.tab !== 'map' ? 'village' : 'map'; }
  function myTribe() { return Tribes.get(S.me.tribe); }

  // ---------- 骨架 ----------
  function boot() {
    var app = document.getElementById('app');
    app.innerHTML = '<header id="hud"></header><main id="stage"><section id="scene">' +
      '<svg id="vsvg" viewBox="0 0 ' + Art.VW + ' ' + Art.VH + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="部落畫面"><g id="vbase"></g><g id="folk"></g></svg>' +
      '<svg id="msvg" role="img" aria-label="臺灣全島地圖"></svg><div id="tools"></div></section>' +
      '<aside id="panel"><nav id="tabs"></nav><div id="pbody"></div></aside></main><div id="toast" role="status" aria-live="polite"></div>';
    ['hud', 'stage', 'scene', 'vsvg', 'vbase', 'folk', 'msvg', 'tools', 'panel', 'tabs', 'pbody', 'toast'].forEach(function (id) { el[id] = document.getElementById(id); });
    document.addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    el.vsvg.addEventListener('click', function (e) {
      var g = e.target.closest('[data-tile]'); if (!g || !S.me) return;
      var i = +g.getAttribute('data-tile'); S.selTile = S.selTile === i ? null : i; S.tab = 'build'; render();
    });
    mapInit();
    window.addEventListener('resize', mapResize);
    setInterval(tickTimers, 250);
    setInterval(moveFolk, 2400);
    Net.on('status', function (s) { S.online = s.online; S.mode = s.mode; render(); });
    Net.on('hello', function (h) { S.pubs = h.villages || S.pubs; if (h.reset) { S.me = null; S.zone = null; S.selTile = null; S.tab = 'build'; } render(); });
    Net.on('state', function (st) { S.me = st.me; S.pubs = st.villages; render(); });
    Net.start();
    render();
  }

  // ---------- 世界地圖 ----------
  function mapInit() {
    var url = Art.paintMap(4).toDataURL('image/png');
    el.msvg.innerHTML = '<g id="cam"><image width="' + Geo.MAP_W + '" height="' + Geo.MAP_H + '" href="' + url + '" preserveAspectRatio="none"/>' +
      '<g id="mzone"></g><g id="mmarks"></g><g id="mlabels">' + Art.mapLabels() + '</g></g>';
    el.cam = document.getElementById('cam'); el.mzone = document.getElementById('mzone'); el.mmarks = document.getElementById('mmarks');
    var ptrs = {}, drag = null;
    function count() { return Object.keys(ptrs).length; }
    function two() { var k = Object.keys(ptrs); return Math.hypot(ptrs[k[0]].x - ptrs[k[1]].x, ptrs[k[0]].y - ptrs[k[1]].y); }
    el.msvg.addEventListener('pointerdown', function (e) {
      try { el.msvg.setPointerCapture(e.pointerId); } catch (x) { /* 有些瀏覽器不支援，拖曳仍可用 */ }
      ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
      if (count() === 1) drag = { x: e.clientX, y: e.clientY, cx: MV.cx, cy: MV.cy, moved: false };
      else if (count() === 2) drag = { pinch: two(), k: MV.k, moved: true };
    });
    el.msvg.addEventListener('pointermove', function (e) {
      if (!ptrs[e.pointerId] || !drag) return;
      ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
      if (drag.pinch && count() === 2) { MV.k = drag.k * two() / drag.pinch; mapApply(); return; }
      if (drag.pinch) return;
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;

      if (drag.moved) { MV.cx = drag.cx - dx / (MV.s0 * MV.k); MV.cy = drag.cy - dy / (MV.s0 * MV.k); mapApply(); }
    });
    function up(e) {
      if (!ptrs[e.pointerId]) return;
      var tap = drag && !drag.moved && count() === 1;
      delete ptrs[e.pointerId];
      if (tap) mapTap(e.clientX, e.clientY);
      if (count() === 0) drag = null;
      else { var k = Object.keys(ptrs)[0]; drag = { x: ptrs[k].x, y: ptrs[k].y, cx: MV.cx, cy: MV.cy, moved: true }; }
    }
    el.msvg.addEventListener('pointerup', up); el.msvg.addEventListener('pointercancel', up);
    el.msvg.addEventListener('wheel', function (e) { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.25 : 0.8, e.clientX, e.clientY); }, { passive: false });
    MV.ready = true; mapResize();
  }
  function toMap(cx, cy) {
    var r = el.msvg.getBoundingClientRect();
    return [((cx - r.left) / MV.s0 - (MV.vw / 2 - MV.cx * MV.k)) / MV.k, ((cy - r.top) / MV.s0 - (MV.vh / 2 - MV.cy * MV.k)) / MV.k];
  }
  function zoomAt(f, cx, cy) {
    var before = toMap(cx, cy); MV.k *= f; mapApply();
    var after = toMap(cx, cy); MV.cx += before[0] - after[0]; MV.cy += before[1] - after[1]; mapApply();
  }
  function mapResize() {
    if (!MV.ready) return;
    var r = el.scene.getBoundingClientRect(); if (!r.width || !r.height) return;
    MV.s0 = Math.min(r.width / Geo.MAP_W, r.height / Geo.MAP_H); MV.vw = r.width / MV.s0; MV.vh = r.height / MV.s0;
    el.msvg.setAttribute('viewBox', '0 0 ' + MV.vw.toFixed(1) + ' ' + MV.vh.toFixed(1));
    mapApply();
  }
  function mapApply() {
    MV.k = Math.max(1, Math.min(7, MV.k));
    MV.cx = Math.max(0, Math.min(Geo.MAP_W, MV.cx)); MV.cy = Math.max(0, Math.min(Geo.MAP_H, MV.cy));
    el.cam.setAttribute('transform', 'translate(' + (MV.vw / 2 - MV.cx * MV.k).toFixed(2) + ' ' + (MV.vh / 2 - MV.cy * MV.k).toFixed(2) + ') scale(' + MV.k.toFixed(3) + ')');
    el.msvg.style.setProperty('--u', (1 / (MV.s0 * MV.k)).toFixed(4));
    el.msvg.classList.toggle('far', MV.k < 1.9);
    renderMarks();
  }
  function focusHex(h, k) { MV.cx = h.x; MV.cy = h.y; if (k) MV.k = Math.max(MV.k, k); mapApply(); }
  function mapTap(cx, cy) {
    var p = toMap(cx, cy), u = 1 / (MV.s0 * MV.k), best = null, bd = 16 * u;
    S.pubs.forEach(function (v) { var d = Math.hypot(v.pos[0] - p[0], v.pos[1] - p[1]); if (d < bd) { bd = d; best = v; } });
    var h = best ? G.byId[best.hex] : Geo.nearestHex(p[0], p[1], Geo.HEX_SIZE * 1.15);
    S.zone = h ? h.id : null;
    if (S.me) S.tab = 'map';
    render();
  }
  function renderMarks() {
    if (!MV.ready) return;
    var u = 1 / (MV.s0 * MV.k), s = '', z = S.zone && G.byId[S.zone];
    setHTML(el.mzone, z ? '<circle class="zsel" cx="' + z.x + '" cy="' + z.y + '" r="' + (Geo.HEX_SIZE * 1.05) + '" style="stroke-width:' + (2.2 * u).toFixed(3) + '"/>' : '');
    G.settlements.forEach(function (st) {
      var r = 5 * u;
      s += '<path class="sett" d="M' + st.x + ' ' + (st.y - r) + 'L' + (st.x + r) + ' ' + st.y + 'L' + st.x + ' ' + (st.y + r) + 'L' + (st.x - r) + ' ' + st.y + 'Z" style="stroke-width:' + (1.4 * u).toFixed(3) + '"/>';
    });
    S.pubs.forEach(function (v) {
      var mine = S.me && v.id === S.me.id, t = Tribes.get(v.tribe), r = (mine ? 6.5 : MV.k < 1.9 ? 3 : 4.2) * u;
      s += '<g class="vm' + (mine ? ' me' : '') + '"><circle cx="' + v.pos[0] + '" cy="' + v.pos[1] + '" r="' + r.toFixed(3) + '" fill="' + t.color + '" style="stroke-width:' + ((mine ? 2.4 : 1.4) * u).toFixed(3) + '"/>' +
        '<text x="' + v.pos[0] + '" y="' + (v.pos[1] + r + 10 * u).toFixed(2) + '" style="font-size:' + (10 * u).toFixed(3) + 'px;stroke-width:' + (2.6 * u).toFixed(3) + '">' + esc(v.name) + '</text></g>';
    });
    setHTML(el.mmarks, s);
  }

  // ---------- 部落畫面 ----------
  var folk = [];
  function renderVillage() {
    var v = S.me; if (!v) return;
    var sig = v.tribe + '|' + v.wall + '|' + S.selTile + '|' + JSON.stringify(v.tiles) + JSON.stringify(v.queue);
    if (el.vbase._sig !== sig) {
      var look = Tribes.get(v.tribe).look;   // 畫面比例不同時，上下多出來的地方用天空與地面的顏色補滿
      el.vsvg.style.background = 'linear-gradient(' + (look.backdrop === 'coast' ? '#BFE0EA' : '#BFDDE0') + ' 50%, ' + look.ground + ' 50%)';
      el.vbase.innerHTML = Art.village(v, S.selTile, v.queue); el.vbase._sig = sig; tickTimers();
    }
    var want = Math.min(v.pop, 12);
    if (folk.length !== want) {
      var t = Tribes.get(v.tribe), s = '';
      folk = [];
      for (var i = 0; i < want; i++) {
        var p = spot(v); folk.push(p);
        s += '<g class="person" style="transform:translate(' + p[0] + 'px,' + p[1] + 'px)"><ellipse cx="0" cy="9" rx="6" ry="2.2" fill="#000" opacity=".22"/><path d="M-5 9c0-8 2-12 5-12s5 4 5 12z" fill="' + (i % 3 ? '#F2EAD6' : t.look.trim) + '"/><circle cx="0" cy="-7" r="4.4" fill="#B98660"/></g>';
      }
      el.folk.innerHTML = s;
    }
  }
  function spot(v) {
    var built = []; for (var i = 0; i < R.TILE_N; i++) if (v.tiles[i] && v.tiles[i].level > 0) built.push(i);
    var p = Art.tileXY(built[Math.floor(Math.random() * built.length)] || R.CENTER_TILE);
    return [Math.round(p[0] + 14 + Math.random() * 68), Math.round(p[1] + 88 + Math.random() * 10)];
  }
  function moveFolk() {
    if (!S.me || scene() !== 'village' || document.hidden) return;
    var nodes = el.folk.children;
    for (var i = 0; i < nodes.length; i++) if (Math.random() < 0.6) { var p = spot(S.me); nodes[i].style.transform = 'translate(' + p[0] + 'px,' + p[1] + 'px)'; }
  }
  function tickTimers() {
    var now = Date.now(), list = document.querySelectorAll('[data-until]');
    for (var i = 0; i < list.length; i++) list[i].textContent = dur((+list[i].getAttribute('data-until') - now) / 1000);
  }

  // ---------- 上方資訊列 ----------
  function chip(ic, label, val, cap) {
    return '<div class="chip" title="' + label + '">' + Art.icon(ic) + '<span class="lbl">' + label + '</span><b>' + val + '</b>' + (cap != null ? '<span class="cap">/' + cap + '</span>' : '') + '</div>';
  }
  function renderHud() {
    var me = S.me, h, badge = '<div class="mode">' + (S.mode === 'solo' ? '單機試玩' : S.online ? '已連線' : '連線中') + '</div>';
    if (!me) h = '<div class="brand">山海部落</div><div class="spacer"></div><div class="turn">橫放手機，畫面更大</div>' + badge;
    else {

        chip('food', t.res.food, n0(me.res.food), d.cap) + chip('mat', t.res.mat, n0(me.res.mat), d.cap) +
        chip('sp', t.sp.zh, n0(me.sp[me.tribe]), d.spCap) + chip('pop', '族人', me.pop, d.popCap) + chip('star', '繁榮', d.prosperity) +

    }

  }

  // ---------- 右側面板 ----------
  function costHTML(me, c, sp) {
    var t = myTribe(), s = '<span class="costs">';
    if (c.food) s += '<span class="cost' + (me.res.food < c.food ? ' lack' : '') + '">' + Art.icon('food') + c.food + '</span>';
    if (c.mat) s += '<span class="cost' + (me.res.mat < c.mat ? ' lack' : '') + '">' + Art.icon('mat') + c.mat + '</span>';
    if (sp) s += '<span class="cost' + ((me.sp[me.tribe] || 0) < sp ? ' lack' : '') + '">' + Art.icon('sp') + sp + ' ' + t.sp.zh + '</span>';
    return s + '</span>';
  }
  function affordable(me, c, sp) { return me.res.food >= c.food && me.res.mat >= c.mat && (me.sp[me.tribe] || 0) >= (sp || 0); }
  function effect(type, L, t) {
    switch (type) {
      case 'center': return '倉庫容量 ' + (300 + 200 * L) + '，其他建築最高可到等級 ' + L;
      case 'house': return '可以住 ' + (1 + 2 * L) + ' 位族人';
      case 'farm': return (2 * L) + ' 個耕作位置，產出' + t.res.food;
      case 'mat': return (2 * L) + ' 個採集位置，產出' + t.res.mat;
      case 'special': return (2 * L) + ' 個工作位置，產出' + t.sp.zh;
      case 'storage': return '倉庫容量 +' + 400 * L + '，特產容量 +' + 20 * L;
    }
    return '';
  }
  function bname(t, type) { var b = t.b[type]; return esc(b.zh) + (b.native ? ' <i class="nat">' + esc(b.native) + '</i>' : ''); }
  function buildingCard(me, i, b) {
    var t = myTribe(), full = me.queue.length >= R.BUILDERS, h = '<section class="card sel"><h3>' + bname(t, b.type) + '<span class="lv">' + (b.level ? '等級 ' + b.level : '興建中') + '</span></h3>';
    if (b.level) h += '<p class="eff">' + effect(b.type, b.level, t) + '</p>';
    if (b.busy) {

      h += '<p class="busyline">施工中，還要 <b data-until="' + (q ? q.doneAt : 0) + '"></b></p>';
    } else if (b.level >= R.MAX_LEVEL) h += '<p class="muted">已經是最高等級。</p>';
    else {
      var to = b.level + 1, c = R.cost(b.type, to), sp = 0, why = '';
      if (b.type === 'center') sp = R.CENTER_UP[to].each * R.CENTER_UP[to].kinds;
      else if (to > me.d.center) why = '要先把' + t.b.center.zh + '升到等級 ' + to;
      if (!why && full) why = '同時只能進行 ' + R.BUILDERS + ' 項工程';
      if (!why && !affordable(me, c, sp)) why = '物資還不夠';
      h += '<p class="eff next">升級後：' + effect(b.type, to, t) + '</p>' +
        '<div class="act"><button class="btn" data-act="upgrade" data-tile="' + i + '"' + (why ? ' disabled' : '') + '>升到等級 ' + to + '</button>' + costHTML(me, c, sp) + '<span class="time">' + dur(R.buildTime(b.type, to)) + '</span></div>' +

  }
  function emptyCard(me, i) {

    STAGE_TYPES.forEach(function (ty) {
      var c = R.cost(ty, 1), have = R.count(me, ty), lim = R.limit(ty, me.d.center), why = '';
      if (have >= lim) why = '已達上限，先升級' + t.b.center.zh; else if (full) why = '工程已滿'; else if (!affordable(me, c)) why = '物資還不夠';
      h += '<li><div class="opt-top"><b>' + bname(t, ty) + '</b><span class="cnt">' + have + '/' + lim + '</span></div><p class="eff">' + effect(ty, 1, t) + '</p>' +
        '<div class="act"><button class="btn sm" data-act="build" data-tile="' + i + '" data-type="' + ty + '"' + (why ? ' disabled' : '') + '>興建</button>' + costHTML(me, c) + '<span class="time">' + dur(R.buildTime(ty, 1)) + '</span></div>' +

  }
  function jobsCard(me) {
    var t = myTribe(), d = me.d, names = { food: t.res.food, mat: t.res.mat, special: t.sp.zh }, ic = { food: 'food', mat: 'mat', special: 'sp' };
    var used = me.jobs.food + me.jobs.mat + me.jobs.special;
    var h = '<section class="card"><h3>族人分工<label class="switch" for="auto"><input type="checkbox" id="auto" data-act="auto"' + (me.auto ? ' checked' : '') + '>自動分配</label></h3>';
    JOBS.forEach(function (k) {
      h += '<div class="job">' + Art.icon(ic[k]) + '<span class="jn">' + names[k] + '</span><div class="stepper"><button data-act="job" data-k="' + k + '" data-d="-1" aria-label="減少' + names[k] + '的人手"' + (me.jobs[k] <= 0 ? ' disabled' : '') + '>−</button>' +
        '<b>' + me.jobs[k] + '/' + d.slots[k] + '</b><button data-act="job" data-k="' + k + '" data-d="1" aria-label="增加' + names[k] + '的人手"' + (me.jobs[k] >= d.slots[k] || used >= me.pop ? ' disabled' : '') + '>＋</button></div>' +
        '<span class="rate">+' + Math.round(d.rates[k] * 60) + '/分</span></div>';
    });
    return h + '<p class="muted">族人 ' + me.pop + ' 位，待命 ' + (me.pop - used) + ' 位。位置不夠時，多蓋或升級對應的建築。</p></section>';
  }
  function queueCard(me) {
    if (!me.queue.length) return '';
    var t = myTribe(), h = '<section class="card"><h3>施工中<span class="lv">' + me.queue.length + '/' + R.BUILDERS + '</span></h3>';
    me.queue.forEach(function (q) { h += '<div class="qrow"><span>' + esc(t.b[q.type].zh) + ' → 等級 ' + q.to + '</span><b data-until="' + q.doneAt + '"></b></div>'; });
    return h + '</section>';
  }
  function buildPanel(me) {
    var h = '';
    if (S.selTile != null) h += me.tiles[S.selTile] ? buildingCard(me, S.selTile, me.tiles[S.selTile]) : emptyCard(me, S.selTile);
    else h += '<p class="hint">點部落裡的建築可以升級，點空地可以蓋新的建築。</p>';
    return h + jobsCard(me) + queueCard(me);
  }
  function tribeCard(t, cells) {
    var h = '<section class="card tribe"><h3><span class="dot" style="background:' + t.color + '"></span>' + t.zh + '<span class="chipst ' + (t.playable ? 'on' : '') + '">' + (t.playable ? '可以落腳' : '之後開放') + '</span></h3>' +
      '<p class="en">' + esc(t.en) + ' · ' + t.terrain + (cells ? ' · 地圖上 ' + cells + ' 格' : '') + '</p><p>' + t.intro + '</p><p class="muted">分布：' + t.area + '</p>';
    if (t.playable) h += '<dl class="facts"><dt>特產</dt><dd>' + t.sp.zh + '（' + t.sp.desc + '）</dd><dt>特長</dt><dd>' + t.bonus.text + '</dd><dt>問候</dt><dd><i class="nat">' + esc(t.hello) + '</i>（' + t.lang + '）</dd></dl>';
    return h + '</section>';
  }
  function zonePanel() {
    if (!S.zone) return '<p class="hint">拖曳可以移動地圖，用兩指或右下角的按鈕縮放。點地圖上的任何地方，看看那裡是誰的區域。</p>';
    var z = G.byId[S.zone], h = '';
    if (z.tribe) h += tribeCard(Tribes.get(z.tribe), (G.regions[z.tribe] || []).length);
    else if (z.settlement) h += '<section class="card"><h3>' + G.settlements.filter(function (s) { return s.id === z.settlement; })[0].name + '<span class="chipst">中立</span></h3><p>平原上的中立聚落。之後可以在這裡交換各族的特產。這裡不能落腳，也不會有衝突。</p></section>';
    else h += '<section class="card"><h3>野地 · ' + WILD[z.wild] + '<span class="chipst">之後開放</span></h3><p>沒有人居住的野地。之後各部落可以派人佔領這裡的資源點。</p></section>';
    var here = S.pubs.filter(function (v) { return v.hex === z.id; });
    if (here.length) {
      h += '<section class="card"><h3>這裡的部落<span class="lv">' + here.length + '/' + Geo.SLOTS + '</span></h3>';
      here.forEach(function (v) {
        var mine = S.me && v.id === S.me.id;
        h += '<div class="qrow"><span>' + esc(v.name) + (mine ? '（你）' : v.bot ? '（示範）' : '') + '</span><b>等級 ' + v.c + ' · 繁榮 ' + v.pros + '</b></div>';
      });
      h += '</section>';
    }
    return h;
  }
  function startPanel() {
    var z = S.zone && G.byId[S.zone], t = z && z.tribe && Tribes.get(z.tribe), ok = t && t.playable;
    var h = '<div class="start"><h1>山海部落</h1><p class="lead">很久以前，島上的山與海之間住著許多族群。選一個地方，建立你的部落。</p>' +
      '<div class="fields"><label for="f-owner">你的名字<input id="f-owner" maxlength="10" autocomplete="off" placeholder="例如：小米"></label>' +
      '<label for="f-name">部落名稱<input id="f-name" maxlength="10" autocomplete="off" placeholder="例如：晨霧部落"></label></div>' +
      '<p class="label">第一版開放的族群</p><div class="picks">';
    Tribes.playable().forEach(function (p) {
      h += '<button class="pick" data-act="pick" data-t="' + p.id + '" aria-pressed="' + (t && t.id === p.id) + '"><span class="dot" style="background:' + p.color + '"></span><b>' + p.zh + '</b><span>' + p.terrain + '</span></button>';
    });
    h += '</div>';
    if (t) h += tribeCard(t, (G.regions[t.id] || []).length);
    else if (z) h += zonePanel();
    else h += '<p class="hint">點上面的族群，或直接在地圖上點一個地方。</p>';
    h += '<button class="btn big" data-act="join"' + (ok && !S.joining ? '' : ' disabled') + '>' + (ok ? '在' + t.zh + '的區域建立部落' : '先選一個可以落腳的區域') + '</button></div>';
    return h;
  }
  function codexPanel(me) {
    var t = myTribe(), h = '<section class="card"><h3><span class="dot" style="background:' + t.color + '"></span>' + t.zh + '<span class="lv">' + esc(t.en) + '</span></h3><p>' + t.intro + '</p>' +
      '<dl class="facts"><dt>問候</dt><dd><i class="nat">' + esc(t.hello) + '</i></dd><dt>謝謝</dt><dd><i class="nat">' + esc(t.thanks) + '</i></dd><dt>語別</dt><dd>' + t.lang + '</dd><dt>特長</dt><dd>' + t.bonus.text + '</dd></dl></section>';
    t.cards.forEach(function (c) { h += '<section class="card"><h3>' + esc(c.t) + '</h3><p>' + esc(c.x) + '</p></section>'; });
    h += '<p class="label">島上的 17 族</p><ul class="tlist">';
    Tribes.LIST.forEach(function (o) { h += '<li><span class="dot" style="background:' + o.color + '"></span><div><b>' + o.zh + '</b><span class="muted"> ' + o.area + '</span><p>' + o.intro + '</p></div></li>'; });
    h += '</ul><p class="muted">' + Tribes.SOURCE_NOTE + '</p>';
    if (S.mode === 'solo') h += '<button class="btn ghost" data-act="reset">' + (Date.now() < S.resetAt ? '再按一次，確定重新開始' : '重新開始（清除單機存檔）') + '</button>';
    return h;
  }
  function renderPanel() {
    var me = S.me;
    if (!me) { setHTML(el.tabs, ''); el.tabs.hidden = true; if (setHTML(el.pbody, startPanel())) restoreForm(); return; }
    el.tabs.hidden = false;
    setHTML(el.tabs, [['build', '部落'], ['map', '地圖'], ['codex', '圖鑑']].map(function (t) {
      return '<button data-act="tab" data-tab="' + t[0] + '" aria-pressed="' + (S.tab === t[0]) + '">' + t[1] + '</button>';
    }).join(''));
    var keep = el.pbody.scrollTop;
    if (setHTML(el.pbody, S.tab === 'build' ? buildPanel(me) : S.tab === 'map' ? zonePanel() : codexPanel(me))) { el.pbody.scrollTop = keep; tickTimers(); }
  }
  function restoreForm() {
    var a = document.getElementById('f-owner'), b = document.getElementById('f-name');
    if (a) a.value = S.form.owner; if (b) b.value = S.form.name;
  }
  function renderTools() {
    setHTML(el.tools, scene() === 'map' ? '<div class="zoom"><button data-act="zoom" data-f="1.5" aria-label="放大">＋</button><button data-act="zoom" data-f="0.667" aria-label="縮小">−</button><button data-act="whole" aria-label="顯示全島">全島</button></div>' : '');
  }
  function render() {
    if (!el.hud) return;
    var sc = scene();
    if (el.scene.getAttribute('data-scene') !== sc) { el.scene.setAttribute('data-scene', sc); if (sc === 'map') setTimeout(mapResize, 0); }
    renderHud(); renderTools(); renderPanel();
    if (sc === 'village') renderVillage(); else renderMarks();
  }

  // ---------- 操作 ----------
  function act(a, okMsg) { Net.act(a, function (r) { if (r && !r.ok) toast(r.msg || '沒有成功', true); else if (okMsg || (r && r.msg)) toast(okMsg || r.msg); }); }
  function onInput(e) {
    if (e.target.id === 'f-owner') S.form.owner = e.target.value;
    else if (e.target.id === 'f-name') S.form.name = e.target.value;
  }
  function onClick(e) {
    var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    var a = b.getAttribute('data-act'), me = S.me;
    if (a === 'tab') { S.tab = b.getAttribute('data-tab'); if (S.tab === 'map' && me) { S.zone = S.zone || me.hex; focusHex(G.byId[me.hex], 2.6); } render(); }
    else if (a === 'pick') {
      var id = b.getAttribute('data-t'), c = G.centroid[id], h = Geo.nearestHex(c[0], c[1]);
      var list = G.regions[id].map(function (x) { return G.byId[x]; }).sort(function (p, q) { return Math.hypot(p.x - c[0], p.y - c[1]) - Math.hypot(q.x - c[0], q.y - c[1]); });
      h = list[0]; S.zone = h.id; focusHex(h, 1.8); render();
    }
    else if (a === 'join') {
      S.joining = true; render();
      Net.join({ owner: S.form.owner, name: S.form.name, tribe: G.byId[S.zone].tribe, hex: S.zone }, function (r) {
        S.joining = false;
        if (!r.ok) { toast(r.msg, true); render(); return; }
        S.tab = 'build'; S.selTile = null; toast('部落建立了。先蓋幾間家屋，讓更多族人住進來。'); render();
      });
    }
    else if (a === 'zoom') { var r = el.msvg.getBoundingClientRect(); zoomAt(+b.getAttribute('data-f'), r.left + r.width / 2, r.top + r.height / 2); }
    else if (a === 'whole') { MV.k = 1; MV.cx = Geo.MAP_W / 2; MV.cy = Geo.MAP_H / 2; mapApply(); }
    else if (a === 'upgrade') act({ type: 'upgrade', tile: +b.getAttribute('data-tile') }, '開始施工');
    else if (a === 'build') act({ type: 'build', tile: +b.getAttribute('data-tile'), type2: b.getAttribute('data-type') }, '開始興建');
    else if (a === 'auto') act({ type: 'auto', on: b.checked });
    else if (a === 'job') {
      var j = { type: 'jobs', food: me.jobs.food, mat: me.jobs.mat, special: me.jobs.special };
      j[b.getAttribute('data-k')] += +b.getAttribute('data-d'); act(j);
    }
    else if (a === 'reset') {
      if (Date.now() < S.resetAt) { S.resetAt = 0; Net.reset(); toast('已重新開始'); }
      else { S.resetAt = Date.now() + 4000; render(); setTimeout(render, 4100); }
    }
  }

  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
  else if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
