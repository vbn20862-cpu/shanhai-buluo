<title>山海部落</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 山海部落 — 版面：橫式時左邊是場景（部落或地圖）、右邊是操作面板；直式時上下堆疊。單一深色主題。 */
:root {
  --bg: #14212A; --sea: #0F2430; --panel: #1C2E38; --raise: #24394A; --line: #30495A;
  --ink: #F2EAD6; --mute: #9DB0B8; --gold: #E3B341; --red: #D0503A; --good: #BFE3C4; --warn: #F0A48F;
  --display: "LXGW WenKai TC", "Noto Serif TC", "PMingLiU", serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 13.5px; line-height: 1.5; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }

#app { height: 100%; display: flex; flex-direction: column; gap: 6px; box-sizing: border-box; padding-block: 6px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 上方資訊列 */
#hud { display: flex; align-items: center; gap: 6px; min-height: 30px; overflow: hidden; }
.brand { font-family: var(--display); font-size: 20px; letter-spacing: .08em; white-space: nowrap; }
.vname { display: flex; align-items: center; gap: 6px; min-width: 0; margin-right: 2px; }
.vname b { font-family: var(--display); font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 8em; }
.vname .sub { color: var(--mute); font-size: 12px; white-space: nowrap; }
.chip { display: flex; align-items: center; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px 2px 7px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip .lbl, .chip .cap { color: var(--mute); font-size: 11.5px; }
.ic { width: 15px; height: 15px; flex: none; }
.ic-food { color: var(--gold); } .ic-mat { color: #BBA88C; } .ic-sp { color: #E58A5C; } .ic-pop { color: #9CC7D8; } .ic-star { color: var(--ink); }
.spacer { flex: 1; }
.mode { font-size: 11.5px; color: var(--mute); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.turn { display: none; font-size: 11.5px; color: var(--gold); white-space: nowrap; }
.dot { width: 11px; height: 11px; border-radius: 3px; display: inline-block; flex: none; }

/* 場景 */
#stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(250px, 37%, 350px); gap: 10px; }
#scene { position: relative; min-width: 0; min-height: 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: linear-gradient(160deg, #15394B, #0E2633); }
#scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#scene[data-scene="map"] #vsvg, #scene[data-scene="village"] #msvg { display: none; }
#vsvg, #msvg { touch-action: none; cursor: grab; font-family: var(--body); user-select: none; -webkit-user-select: none; }
#vsvg { background: #1E2F27; }
.person { transition: transform 2.2s linear; pointer-events: none; }
.rlabel { font-size: calc(var(--u, 1) * 11px); font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: rgba(12, 28, 38, .85); stroke-width: calc(var(--u, 1) * 3px); stroke-linejoin: round; text-anchor: middle; pointer-events: none; }
.rlabel:not(.play) { fill: #D5DCD6; font-weight: 500; }
.far .rlabel.minor { display: none; }
.zsel { fill: rgba(227, 179, 65, .2); stroke: var(--gold); }
.sett { fill: var(--ink); stroke: var(--bg); }
.vm circle { stroke: var(--ink); }
.vm.me circle { stroke: var(--gold); }
.vm text { fill: var(--ink); paint-order: stroke; stroke: rgba(12, 28, 38, .85); stroke-linejoin: round; text-anchor: middle; font-weight: 500; pointer-events: none; }
.far .vm:not(.me) text { display: none; }
#tools { position: absolute; right: 8px; bottom: 8px; }
.zoom { display: flex; gap: 4px; }
.zoom button { min-width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: rgba(20, 33, 42, .88); color: var(--ink); font-size: 16px; padding: 0 8px; }
.zoom button:last-child { font-size: 12.5px; }

/* 面板 */
#panel { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
#tabs { display: flex; gap: 4px; }
#tabs button { flex: 1; border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 4px 0; color: var(--mute); font-weight: 700; letter-spacing: .1em; }
#tabs button[aria-pressed="true"] { background: var(--panel); color: var(--ink); border-color: var(--gold); }
#pbody { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; overscroll-behavior: contain; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.card.sel { border-color: var(--gold); }
h3 { font-family: var(--display); font-size: 16.5px; margin: 0 0 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; text-wrap: balance; }
h3 .lv { margin-left: auto; font-family: var(--body); font-size: 12px; font-weight: 500; color: var(--mute); }
.nat { font-family: var(--body); font-style: italic; font-weight: 500; font-size: .88em; color: var(--gold); }
p { margin: 4px 0; }
.eff.next { color: var(--good); }
.muted, .en { color: var(--mute); font-size: 12.5px; }
.note { color: var(--mute); font-size: 12.5px; border-top: 1px dashed var(--line); padding-top: 6px; margin: 8px 0 0; }
.why { color: var(--warn); font-size: 12.5px; }
.busyline b, .qrow b { font-variant-numeric: tabular-nums; }
.hint { color: var(--mute); margin: 2px 0; }
.label { font-size: 11.5px; letter-spacing: .12em; color: var(--mute); margin: 6px 0 0; }
.act { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.btn { border: 0; border-radius: 8px; background: var(--gold); color: #2A1F05; font-weight: 700; padding: 6px 13px; }
.btn.sm { padding: 4px 12px; }
.btn.big { width: 100%; padding: 10px; font-size: 15px; margin-top: 8px; }
.start .btn.big { position: sticky; bottom: 0; box-shadow: 0 -10px 12px 4px var(--bg); }
.start .btn.big:disabled { opacity: 1; background: #5B5340; color: #1F1A0C; }
.btn.ghost { background: transparent; color: var(--mute); border: 1px solid var(--line); font-weight: 500; }
.btn:disabled { opacity: .42; }
.costs { display: flex; gap: 9px; flex-wrap: wrap; }
.cost { display: inline-flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
.cost.lack { color: var(--warn); }
.gain { display: inline-flex; align-items: center; gap: 3px; color: var(--good); font-variant-numeric: tabular-nums; }
.time { margin-left: auto; color: var(--mute); font-size: 12px; white-space: nowrap; }
.opts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.opts li { border-top: 1px dashed var(--line); padding-top: 8px; }
.opts li:first-child { border-top: 0; padding-top: 0; }
.opt-top { display: flex; justify-content: space-between; gap: 8px; }
.cnt { color: var(--mute); font-size: 12px; font-variant-numeric: tabular-nums; }
.job { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.jn { flex: 1; min-width: 0; }
.stepper { display: flex; align-items: center; gap: 5px; }
.stepper button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); font-size: 17px; line-height: 1; padding: 0; }
.stepper button:disabled { opacity: .4; }
.stepper b { min-width: 2.8em; text-align: center; font-variant-numeric: tabular-nums; }
.rate { color: var(--good); font-size: 12px; min-width: 3.8em; text-align: right; font-variant-numeric: tabular-nums; }
.switch { margin-left: auto; font-family: var(--body); font-size: 12px; font-weight: 500; color: var(--mute); display: flex; align-items: center; gap: 5px; cursor: pointer; }
.switch input { accent-color: var(--gold); width: 15px; height: 15px; margin: 0; }
.qrow { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
.qrow b { color: var(--gold); font-weight: 500; white-space: nowrap; }
.chipst { margin-left: auto; font-family: var(--body); font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--mute); white-space: nowrap; }
.chipst.on { background: var(--gold); border-color: var(--gold); color: #2A1F05; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; margin: 6px 0 0; }
.facts dt { color: var(--mute); }
.facts dd { margin: 0; }

/* 開始畫面 */
.start { display: flex; flex-direction: column; gap: 6px; }
.start h1 { font-family: var(--display); font-size: 26px; letter-spacing: .08em; margin: 0; line-height: 1.2; }
.lead { color: var(--mute); margin: 0; }
.fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.fields label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--mute); }
.fields label.wide { grid-column: 1 / -1; }
.fields input { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; color: var(--ink); font-size: 14px; min-width: 0; }
.picks { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
.pick { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 0 7px; text-align: left; border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 9px; }
.pick span:last-child { grid-column: 2; color: var(--mute); font-size: 12px; }
.pick[aria-pressed="true"] { background: var(--panel); border-color: var(--gold); }
.tlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.tlist li { display: flex; gap: 8px; align-items: baseline; }
.tlist p { margin: 0; color: var(--mute); font-size: 12.5px; }

/* 提示訊息 */
#toast { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; z-index: 20; }
.toast { background: var(--ink); color: #1A262E; border-radius: 999px; padding: 6px 14px; font-weight: 500; box-shadow: 0 4px 14px rgba(0, 0, 0, .35); max-width: 86vw; }
.toast.bad { background: #F4C7B8; }

/* 掛機、拜訪、離線報告 */
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin: 4px 0 8px; }
.seg button { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 5px 2px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--ink); border-color: var(--gold); font-weight: 700; }
.switch.wide { margin: 0 0 4px; font-size: 13.5px; color: var(--ink); }
.vrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; border-top: 1px dashed var(--line); }
.vrow:first-of-type { border-top: 0; }
.vrow .muted { display: block; }
.visiting { font-size: 12px; font-weight: 700; color: #2A1F05; background: var(--gold); border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
.mode.off { color: var(--warn); border-color: var(--warn); }
.veil { position: fixed; inset: 0; z-index: 15; background: rgba(8, 16, 22, .72); display: flex; align-items: center; justify-content: center; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--panel); border: 1px solid var(--gold); border-radius: 12px; padding: 14px 16px; width: min(360px, 100%); max-height: 100%; overflow-y: auto; box-sizing: border-box; }
.sheet h2 { font-family: var(--display); font-size: 21px; margin: 0; }
.rep { list-style: none; margin: 8px 0 0; padding: 0; }
.rep li { display: flex; align-items: center; gap: 7px; padding: 4px 0; border-top: 1px dashed var(--line); }
.rep li span { flex: 1; }
.rep b { color: var(--good); font-variant-numeric: tabular-nums; }
.rep b.neg { color: var(--warn); }

/* 交流：聯盟、市集、族群關係、資源點、中立聚落 */
#tabs button { letter-spacing: .04em; white-space: nowrap; min-width: 0; }
#pbody select, #pbody input[type="number"], #pbody input:not([type]), .sheet select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 7px; color: var(--ink); font-size: 13.5px; min-width: 0; }
.inrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; margin: 6px 0; }
.splist { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 2px 0 6px; }
.spi { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.offer, .barter { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--line); }
.offer .muted, .barter .muted { display: block; }
.barter { flex-direction: column; align-items: stretch; gap: 5px; }
.bbtns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.bbtns .btn { padding: 5px 2px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.oform { display: grid; grid-template-columns: auto 4.2em minmax(0, 1fr); gap: 5px 6px; align-items: center; margin: 4px 0 7px; }
.oform span { color: var(--mute); font-size: 12.5px; white-space: nowrap; }
.relrow { display: grid; grid-template-columns: 5.4em minmax(0, 1fr) 2.6em; align-items: center; gap: 8px; padding: 3px 0; }
.relbar { position: relative; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #7A3B33, var(--raise) 40%, var(--raise) 60%, #3F6B4A); }
.relbar i { position: absolute; top: -3px; width: 4px; height: 14px; margin-left: -2px; border-radius: 2px; background: var(--ink); }
.relrow b { font-size: 12.5px; text-align: right; color: var(--mute); }
.relrow b.friend { color: var(--good); } .relrow b.hostile { color: var(--warn); }
.feed { margin: 0; padding: 4px 0; border-top: 1px dashed var(--line); color: var(--mute); font-size: 12.5px; }
.spneed { color: var(--gold); font-size: 12.5px; margin: 4px 0 0; }
.sheet select { width: 100%; margin: 2px 0 6px; box-sizing: border-box; }
.pflag path:first-child { stroke: #2A1F05; fill: none; }
.pflag path:last-child { stroke: var(--ink); }
.pflag.me path:last-child { stroke: var(--gold); }
.vm.ally circle { stroke: var(--good); }
.allytag { font-size: 12px; font-weight: 700; color: var(--good); align-self: center; }
.vrow { flex-wrap: wrap; }

/* 軍事與對戰 */
.seg.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ic-army { color: #E7B9A0; } .ic-shield { color: var(--good); }
.chip.safe { border-color: var(--good); color: var(--good); }
.chip.bless { border-color: var(--gold); color: var(--gold); }
/* 任務主線與共聚 */
.card.quest { border-color: rgba(227, 179, 65, .55); }
.card.quest.ready { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.card.quest h3 .ic, .card h3 > .ic { width: 15px; height: 15px; color: var(--gold); margin-right: 5px; vertical-align: -2px; }
.story { margin: 6px 0; line-height: 1.65; }
.story b { display: block; font-family: var(--display); color: var(--gold); font-size: 15px; margin-bottom: 1px; }
.goal { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-top: 6px; }
.goal b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { height: 6px; border-radius: 3px; background: var(--raise); overflow: hidden; margin: 4px 0 6px; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 3px; }
.card.quest > .btn { width: 100%; margin-top: 4px; }
.opts li.uq { border-color: rgba(227, 179, 65, .55); }
.opts li.uq .cnt { color: var(--gold); }
.units.n5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.units .uq b, .units .uq span { color: var(--gold); }
.units { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 6px 0; text-align: center; }
.units div { background: var(--raise); border-radius: 8px; padding: 5px 2px; }
.units b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.units span { font-size: 11.5px; color: var(--mute); }
.card.alert { border-color: var(--warn); }
.card.alert h3 { color: var(--warn); }
.planrow { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 8px; }
.planrow span { color: var(--mute); font-size: 12.5px; white-space: nowrap; }
.planrow .seg { margin: 3px 0; }
.rrow { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--line); cursor: pointer; }
.rrow span:nth-child(2) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rrow b { color: var(--mute); font-weight: 500; font-size: 12.5px; white-space: nowrap; }
.tag { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 0 7px; }
.tag.win { background: var(--good); color: #12301A; } .tag.lose { background: #5A3A34; color: #F4C7B8; }
.vbtns { display: flex; gap: 5px; flex: none; }
.act.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); margin-top: 10px; }
.act.two .btn { padding: 9px; }
.sheet.wide { width: min(420px, 100%); }
.tbtns { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.tbtns .btn { padding: 7px 12px; text-align: left; }
.scout { background: var(--raise); border-radius: 8px; padding: 5px 9px; margin: 6px 0 2px; }
.sheet.battle { width: min(680px, 100%); display: flex; flex-direction: column; gap: 8px; }
.bhead { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; }
.side b { display: block; font-family: var(--display); font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side span { color: var(--mute); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.side.r { text-align: right; } .side.r span { justify-content: flex-end; }
.bmid { text-align: center; min-width: 6.5em; }
.bmid span { display: block; color: var(--mute); font-size: 12px; }
.bmid b { font-size: 20px; color: var(--gold); font-variant-numeric: tabular-nums; }
.lanes { display: flex; flex-direction: column; gap: 5px; }
.lane { display: grid; grid-template-columns: minmax(0, 1fr) 7.5em minmax(0, 1fr); align-items: center; gap: 8px; background: var(--raise); border: 1px solid var(--line); border-radius: 9px; padding: 5px 10px; }
.lane.broken { border-color: var(--warn); background: #3A2B2A; }
.lane.held { opacity: .72; }
.force b { font-size: 19px; font-variant-numeric: tabular-nums; margin-right: 6px; }
.force span { color: var(--mute); font-size: 12px; }
.force.d { text-align: right; }
.lmid { text-align: center; }
.lmid b { display: block; font-family: var(--display); font-size: 15px; }
.lmid span { font-size: 11.5px; color: var(--mute); }
.lane.broken .lmid span { color: var(--warn); font-weight: 700; }
.bnote { margin: 0; min-height: 2.9em; }
.cmds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.cmds button { border: 1px solid var(--gold); background: transparent; border-radius: 9px; padding: 7px 8px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.cmds button b { font-family: var(--display); font-size: 16px; color: var(--gold); }
.cmds button span { font-size: 11.5px; color: var(--mute); line-height: 1.35; }
.cmds button:disabled { border-color: var(--line); opacity: .55; }
.cmds button[aria-pressed="true"] { background: var(--gold); opacity: 1; }
.cmds button[aria-pressed="true"] b, .cmds button[aria-pressed="true"] span { color: #2A1F05; }
.cmds.h4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.cmds button.hero { border-style: double; border-width: 3px; background: rgba(227, 179, 65, .12); }
.cmds button.hero:disabled { background: transparent; }
.bres { border-radius: 9px; padding: 8px 12px; border: 1px solid var(--line); }
.bres.win { border-color: var(--good); } .bres.lose { border-color: var(--warn); }
.bres h3 { margin: 0; } .bres.win h3 { color: var(--good); } .bres.lose h3 { color: var(--warn); }
.blog { margin: 0; padding-left: 1.2em; color: var(--mute); font-size: 12.5px; display: flex; flex-direction: column; gap: 3px; }
.mline { stroke: var(--gold); fill: none; opacity: .75; }
.mdot { fill: var(--gold); stroke: var(--bg); }
.mdot.fight { fill: var(--red); }

@media (max-width: 860px) { .chip .lbl { display: none; } }

<script>
/* 山海部落 — 連線層

  'use strict';
  var handlers = {}, mode = null, socket = null, local = null, localId = null, memToken = null;
  var SAVE_KEY = 'shanhai_solo_v2', TOKEN_KEY = 'shanhai_token', RICH_KEY = 'shanhai_test_rich', rich = false;

  function on(ev, fn) { handlers[ev] = fn; }

      memToken = t; store(TOKEN_KEY, t);

  }

  // ----- 單機 -----
  function startLocal() {
    mode = 'solo';

    if (saved) { try { local.load(JSON.parse(saved)); } catch (e) { /* 壞掉的存檔就重新開始 */ } }

    local.ensureBots(now);
    localId = local.tokens.solo && local.villages[local.tokens.solo] ? local.tokens.solo : null;
    if (localId) local.setOnline(localId, true, now);   // 補算關掉網頁這段時間，並產生離線報告
    fire('status', { online: true, mode: mode });
    fire('hello', { villages: pubs(now), resumed: !!localId });

    setInterval(function () {
      var t = Date.now();
      fill(); local.tick(t); fill();
      if (localId) fire('state', local.snapshot(localId, t)); else fire('hello', { villages: pubs(t), resumed: false });
      if (++n % 10 === 0) save();

      fire('hello', { villages: pubs(Date.now()), resumed: false, reset: true });
    }
  };
})();

  /* 可以拖曳、縮放的畫面。cover=true 時畫面一定被場景填滿（部落）；false 時整張圖都看得到（地圖）。 */
  function PanZoom(svg, cam, W, H, o) {

    };

      self.cx = Math.max(hx, Math.min(W - hx, self.cx)); self.cy = Math.max(hy, Math.min(H - hy, self.cy));
      cam.setAttribute('transform', 'translate(' + (self.vw / 2 - self.cx * self.k).toFixed(2) + ' ' + (self.vh / 2 - self.cy * self.k).toFixed(2) + ') scale(' + self.k.toFixed(3) + ')');
      if (o.onChange) o.onChange(self);
    };
    this.resize = function () {
      var r = svg.getBoundingClientRect(); if (!r.width || !r.height) return false;
      self.s0 = o.cover ? Math.max(r.width / W, r.height / H) : Math.min(r.width / W, r.height / H);
      self.vw = r.width / self.s0; self.vh = r.height / self.s0; self.sized = true;

    };
    this.zoomAt = function (f, cx, cy) {

    };

    this.focus = function (x, y, k) { self.cx = x; self.cy = y; if (k) self.k = k; self.apply(); };

    });

  }

  // ---------- 世界地圖 ----------

    var h = best ? G.byId[best.hex] : Geo.nearestHex(x, y, Geo.HEX_SIZE * 1.15);

        '<circle class="mdot' + (m.phase === 'fight' ? ' fight' : '') + '" cx="' + x.toFixed(2) + '" cy="' + y.toFixed(2) + '" r="' + (4 * u).toFixed(3) + '" style="stroke-width:' + (1.4 * u).toFixed(3) + '"/>';
    });
